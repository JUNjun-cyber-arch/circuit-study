function bookLessonHTML(l,open=false){return '<article class="book-lesson"><h1>'+lessonLabel(l)+'　'+esc(l.title)+'</h1><p class="help">建议'+esc(l.minutes)+'分钟。基础：'+esc(l.prereq)+'</p>'+lessonContext(l)+'<h2>本讲概览</h2><ul>'+l.goals.map(x=>'<li>'+readableMath(x)+'</li>').join('')+'</ul><h2>带着问题学</h2><ol>'+l.guides.map(x=>'<li>'+readableMath(x)+'</li>').join('')+'</ol>'+l.sections.map((sec,i)=>'<section><h2>'+(i+1)+'. '+esc(sec.title)+'</h2>'+teachingAid(sec)+readableBody(sec.body)+(sec.diagram?Figures.render(sec.diagram):'')+bookQuestion(sec.q,open)+'</section>').join('')+'<h2>讲末综合例题</h2><p>'+readableMath(l.finale.intro)+'</p>'+(l.finale.diagram?Figures.render(l.finale.diagram):'')+l.finale.parts.map(q=>bookQuestion(q,open)).join('')+'<details '+(open?'open':'')+'><summary>整题分步解析</summary><div class="book-answer"><ol>'+l.finale.solution.map(x=>'<li>'+readableMath(x)+'</li>').join('')+'</ol></div></details><h2>回顾与验收</h2><ul>'+l.finale.takeaways.map(x=>'<li>'+readableMath(x)+'</li>').join('')+'</ul>'+lessonPractice(l)+'<p>现在重新回答开场问题，再记录一项能独立解释的内容和一个仍需复习的地方。</p></article>';}
const sourceHTML='<ul><li><a href="https://ocw.mit.edu/courses/6-002-circuits-and-electronics-spring-2007/">MIT OpenCourseWare：Circuits and Electronics</a></li><li><a href="https://openstax.org/books/university-physics-volume-2/pages/10-5-rc-circuits">OpenStax：RC Circuits</a></li><li><a href="https://openstax.org/books/university-physics-volume-2/pages/15-summary">OpenStax：Alternating-Current Circuits</a></li><li><a href="https://nptel.ac.in/courses/108105053">NPTEL：Basic Electrical Technology</a></li></ul>';
function bookDocument(){return '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电气自习室讲义</title><style>'+APP_STYLES+'body{background:#fff}.book-wrap{max-width:900px;margin:40px auto;padding:0 28px 70px}.book-lesson{border-top:2px solid #d9e3ee;padding-top:30px;margin-top:50px}.book-lesson h1{color:#162e48;font-size:30px}.book-lesson h2{margin-top:32px}.book-q{border-top:1px dashed #d9e3ee;padding:16px 0;margin-top:20px}.book-q p{margin:8px 0}.book-answer{background:#f5f8fc;padding:14px 18px;margin-top:10px;font-size:15px}details summary{cursor:pointer;color:#1463db;font-size:14px}.book-tools{position:sticky;top:0;background:white;padding:12px 0;border-bottom:1px solid #d9e3ee;font-size:14px}.book-contents{line-height:2}@media print{.book-tools{display:none}.book-wrap{margin:0;padding:0}.book-lesson{break-before:page}.book-lesson:first-of-type{break-before:auto}.book-q{break-inside:avoid}details summary{display:none}.book-answer{background:#fff}.circuit{background:#fff}}</style></head><body><main class="book-wrap content"><div class="book-tools"><button onclick="window.print()" class="secondary">打印 / 保存PDF（含解析）</button>　无需联网，折叠区可自行展开。</div><h1>电气自习室讲义</h1><p>与离线学习网页配套，包含电路核心课程和电机学入门。电路保留原学习清单讲号，电机学按教材章节编排。先独立作答，再展开提示和解析。全部内容已保存在文件中，下面参考资料链接仅供有网络时查阅。</p><nav class="book-contents">'+DATA.lessons.map(l=>'<div><a href="#book-'+l.id+'">'+lessonLabel(l)+'　'+esc(l.title)+'</a></div>').join('')+'</nav>'+DATA.lessons.map(l=>'<div id="book-'+l.id+'">'+bookLessonHTML(l)+'</div>').join('')+'<h2>参考与边界</h2><p>本讲义为原创教学整理及自编例题；公式和原理按公开基础教学资料核对。电路原始讲号来自已有课程清单。电机学的教材出处标在各讲及小节中。</p>'+sourceHTML+'<p>电路参数用于计算和仿真。实物器件、测量条件和安全边界需要单独核对，三相与市电实操应在合适保护与专业指导下进行。</p></main><script>window.addEventListener("beforeprint",function(){document.querySelectorAll("details").forEach(function(d){d.open=true;});});<\/script></body></html>';}
function download(name,text,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function markdownRecord(){
 let out='# 电气离线学习记录\n\n导出时间：'+new Date().toLocaleString('zh-CN')+'\n\n这是离线预设题与个人笔记的记录，请结合实际过程继续指导。\n';
 for(const l of DATA.lessons){const st=lessonState(l.id),stats=countStats(l);if(!stats.attempted&&!st.notes&&!st.reflection&&!st.done&&!Object.values(st.guides).some(Boolean))continue;
  out+='\n## '+lessonLabel(l)+' '+l.title+'\n\n状态：'+(st.done?'已记录完成':'学习中')+'；自评：'+st.confidence+'；待复习：'+(st.review?'是':'否')+'。检查点当前正确'+stats.correct+'/'+stats.total+'。\n';
  for(const [i,g] of l.guides.entries())if(st.guides[i])out+='\n引导问题：'+g+'\n我的想法：'+st.guides[i]+'\n';
  for(const q of [...l.sections.map(s=>s.q),...l.finale.parts]){const a=st.answers[q.id];if(!a?.attempts)continue;out+='\n- '+q.prompt+'\n  我的提交：'+(q.type==='choice'?q.options[a.choice]||'未选':(a.raw+' '+(UnitTable[a.unit]?.[0]||'')))+'\n  检查结果：'+(a.feedback?.correct===true?'正确':a.feedback?.message||'待检查')+'；尝试次数：'+a.attempts+'\n';}
  if(st.notes)out+='\n解题草稿：\n'+st.notes+'\n';if(st.reflection)out+='\n学习小结与疑问：\n'+st.reflection+'\n';
 }
 return out;
}
function showRecords(){
 const items=DATA.lessons.flatMap(l=>{const st=lessonState(l.id);return [...l.sections.map(s=>s.q),...l.finale.parts].filter(q=>st.answers[q.id]?.attempts&&st.answers[q.id]?.feedback?.correct!==true).map(q=>({l,q,a:st.answers[q.id]}));});
 const review=DATA.lessons.filter(l=>lessonState(l.id).review);
 document.getElementById('records-body').innerHTML='<p class="help">这里列出当前未通过的检查点和你主动标记的复习项。导出学习记录后，可以在额度恢复时带回对话。</p>'+(review.length?'<h3>待复习课程</h3><p>'+review.map(l=>lessonLabel(l)+' '+esc(l.title)).join('；')+'</p>':'')+(items.length?'<ul class="record-list">'+items.map(({l,q,a})=>'<li><h3>'+lessonLabel(l)+' · '+esc(q.tag)+'</h3><p>'+esc(q.prompt)+'</p><p>'+esc(a.feedback?.message||'待检查')+'</p><button class="quiet" data-jump-question="'+q.id+'" data-owner="'+l.id+'">回到这道题</button></li>').join('')+'</ul>':'<p class="empty">暂时没有待检查的错误记录。你可以先进入知识小节或综合例题作答。</p>');
 document.getElementById('records-dialog').showModal();
}
function getAnswer(id){const st=lessonState(state.currentLesson);return st.answers[id]??(st.answers[id]={raw:'',unit:'',choice:null,hints:0,solution:false,attempts:0});}
function startApp(){
 document.getElementById('storage-warning').classList.toggle('hidden',storageOK);
 document.getElementById('lesson-footer').innerHTML='本地学习包：无AI接口、无网络判题。开放式推导可记入草稿，并对照解析核对。<br><span id="save-status">'+(storageOK?'进度自动保存在此浏览器':'请导出进度备份')+'</span>；移动文件、换浏览器或清理浏览数据前，先导出进度。<details class="footer-details"><summary>课程范围、参考资料与使用边界</summary><p>当前包含电路核心11讲和电机学前3讲。讲解、图示和例题为自主整理；电机学各小节标注教材出处。下列链接是电路延伸资料。</p>'+sourceHTML+'</details>';
 try{const hash=new URLSearchParams(location.hash.slice(1));if(lessonById.has(hash.get('lesson'))){state.currentLesson=hash.get('lesson');const p=position(state.currentLesson);if(Stages.some(s=>s[0]===hash.get('stage')))p.stage=hash.get('stage');const sec=Number(hash.get('section'));if(Number.isInteger(sec)&&sec>=0&&sec<lessonById.get(state.currentLesson).sections.length)p.section=sec;}}catch{}
 renderSidebar();renderMain();
 document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('[data-param]')){updateWidget(t.closest('[data-widget]'));return;}
  if(t.dataset.answer){const a=getAnswer(t.dataset.answer);if(t.type==='radio')a.choice=Number(t.value);else a.raw=t.value;a.feedback=null;document.getElementById('quiz-'+t.dataset.answer)?.querySelector('.feedback')?.remove();persist();}
  if(t.dataset.guide!==undefined){lessonState(state.currentLesson).guides[t.dataset.guide]=t.value;persist();}
  if(t.dataset.note){lessonState(state.currentLesson)[t.dataset.note]=t.value;persist();}
 });
 document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.unit){const a=getAnswer(t.dataset.unit);a.unit=t.value;a.feedback=null;document.getElementById('quiz-'+t.dataset.unit)?.querySelector('.feedback')?.remove();persist();}
  if(t.hasAttribute('data-confidence')){lessonState(state.currentLesson).confidence=t.value;persist();}
  if(t.hasAttribute('data-review')){lessonState(state.currentLesson).review=t.checked;persist();}
 });
 document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.subject&&Object.hasOwn(Subjects,t.dataset.subject)){
   const subject=t.dataset.subject;
   const last=state.lastLessons[subject];
   if(subject!==subjectOf(lessonById.get(state.currentLesson)))route({lesson:last||(subject==='circuits'?'7':lessonsFor(subject)[0].id)});
   return;
  }
  if(t.dataset.lesson){route({lesson:t.dataset.lesson});return;}
  if(t.dataset.stage){route({stage:t.dataset.stage});return;}
  if(t.dataset.section!==undefined){route({section:t.dataset.section});return;}
  if(t.dataset.jumpQuestion){document.getElementById('records-dialog').close();const l=lessonById.get(t.dataset.owner),index=l.sections.findIndex(s=>s.q.id===t.dataset.jumpQuestion);route(index>=0?{lesson:l.id,section:index}:{lesson:l.id,stage:'case'});document.getElementById('quiz-'+t.dataset.jumpQuestion)?.scrollIntoView({block:'center'});return;}
  const act=t.dataset.action,q=t.dataset.q?questions.get(t.dataset.q):null;
  if(act==='check'&&q){const a=getAnswer(q.id);a.feedback=grade(q,a);if(a.feedback.correct!==null)a.attempts++;persist();updateQuestion(q);return;}
  if(act==='hint'&&q){const a=getAnswer(q.id);a.hints=Math.min((a.hints||0)+1,hintList(q).length);persist();updateQuestion(q);return;}
  if(act==='solution'&&q){const a=getAnswer(q.id);a.solution=!a.solution;persist();updateQuestion(q);return;}
  if(act==='full-solution'){const a=lessonState(state.currentLesson);a.fullSolution=!a.fullSolution;persist();renderMain();return;}
  if(act==='complete'){lessonState(state.currentLesson).done=true;persist();renderSidebar();renderMain();toast('已保存完成记录；可以保留待复习项。');return;}
  if(act==='export'){persist();download('电气学习进度-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state,null,2),'application/json;charset=utf-8');toast('进度文件已生成，请妥善保存。');return;}
  if(act==='import'){document.getElementById('import-file').click();return;}
  if(act==='record-export'){download('电气学习记录.md',markdownRecord(),'text/markdown;charset=utf-8');toast('学习记录已生成，可带回对话继续讨论。');return;}
  if(act==='book'){download('电气自习室讲义.html',bookDocument(),'text/html;charset=utf-8');return;}
  if(act==='print'){document.getElementById('print-area').innerHTML=bookLessonHTML(lessonById.get(state.currentLesson),true);window.print();return;}
  if(act==='records'){showRecords();return;}
  if(act==='close-records'){document.getElementById('records-dialog').close();return;}
  if(act==='menu'){document.getElementById('sidebar').classList.toggle('open');return;}
 });
 document.getElementById('import-file').addEventListener('change',async e=>{
  const file=e.target.files[0];if(!file)return;
  try{if(file.size>1000000)throw Error('进度文件超过1 MB，请选择本学习包导出的文件。');const imported=normalizeState(JSON.parse(await file.text()));state=imported;persist();renderSidebar();renderMain();toast('已导入进度。导入内容将替换当前本机记录。');}
  catch(err){toast('未导入：'+err.message);}finally{e.target.value='';}
 });
}
globalThis.CourseEngine={parseValue,grade,normalizeState,UnitTable,allQuestions,bookDocument,bookLessonHTML};
if(typeof document!=='undefined')document.addEventListener('DOMContentLoaded',startApp);


</script></body></html>
