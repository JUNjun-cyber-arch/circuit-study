ort">导出为学习记录</button></dialog><input type="file" class="hidden" id="import-file" accept=".json,application/json"><div class="toast hidden" id="toast" role="status" aria-live="polite"></div><div class="print-area" id="print-area"></div><noscript><p style="padding:30px">互动学习需要浏览器启用JavaScript。你也可以直接打开随包的“电气自习室讲义.html”阅读全部内容。</p></noscript><script>const DATA={"version":1,"date":"2026-10-30","title":"电路自习室","lessons":[{"id":"1","title":"参考方向与功率","group":"直流分析","minutes":"45–60","prior":"已学一轮，可复习","prereq":"会做基本乘除，认识电压、电流的单位。","goals":["区分参考方向与真实方向","根据电压、电流参考关系判断吸收或发出功率","算完能检查单位和功率平衡"],"guides":["电流算出负数，是不是电路出了问题？","同一个电源能不能有时供电、有时吸收能量？","为什么同样的 u、i，有时功率用 ui，有时用 −ui？"],"sections":[{"title":"先约定，再计算","body":"\u003cp>电流是电荷流动的快慢，单位是安培 A；电压是两点之间的电位差，单位是伏特 V。分析前先画电流箭头，标电压的正负端。这些标记是我们选择的参考方向，不会强迫实际电流按它流。\u003c/p>\u003cp>规定电流向右为正，算得 i=−2 A，表示真实电流向左、大小为 2 A。不要去掉负号后继续代入原方程；如果改箭头，就要同时改变这个变量的符号。\u003c/p>\u003cdiv class=\"equation\">U\u003csub>ab\u003c/sub> = V\u003csub>a\u003c/sub> − V\u003csub>b\u003c/sub>；U\u003csub>ba\u003c/sub> = −U\u003csub>ab\u003c/sub>\u003c/div>","q":{"id":"c1-1","type":"choice","prompt":"规定电流向下为正，结果为 −0.5 A。实际方向是？","options":["向上，大小0.5 A","向下，大小0.5 A","没有电流"],"answer":0,"explain":"负号只说明实际方向与参考方向相反。","hints":["先保留原参考箭头，再解释负号。"],"tag":"参考方向"},"diagram":null,"widget":null,"intuition":"电流箭头像地图上的正方向：先规定向右为正，算出负数就说明实际向左。电压也一样，Uab 的意思是用 a 点电位减 b 点电位。","conceptFlow":["先画参考方向","带符号求解","负数表示相反"],"exampleDiagram":"series12","referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/10-1-electromotive-force"},{"title":"功率要连着参考关系一起看","body":"\u003cp>功率描述能量交换的快慢，单位 W。在吸收功率的约定中，电流参考箭头进入电压标“+”的一端，称关联参考方向，此时 p=ui。若电流箭头从“+”端流出，吸收功率就写 p=−ui。\u003c/p>\u003cp>判断顺序固定为：看箭头与正端的关系 → 选表达式 → 代入带符号的数值。算得吸收功率 p&gt;0，元件吸收能量；p&lt;0，元件向外供能。电源充电、放电时可能呈现不同的能量方向。\u003c/p>\u003cdiv class=\"equation\">关联：p\u003csub>吸收\u003c/sub> = ui　　非关联：p\u003csub>吸收\u003c/sub> = −ui\u003c/div>","q":{"id":"c1-2","type":"number","prompt":"某元件 u=6 V，i=2 A，电流从电压正端流出。吸收功率是多少？","value":-12,"unit":"W","explain":"电流从正端流出，用 p吸收=−ui=−6×2=−12 W，表示发出12 W。","hints":["先判断是否进入正端。","这里 p吸收=−ui。"],"tag":"功率符号"},"diagram":"power","widget":null,"intuition":"功率先看电流箭头从元件的哪一端进入。进入标有“+”的端子，ui 为正表示吸收；从“+”端流出时，吸收功率要写成 −ui。","conceptFlow":["找电压正端","看电流进入哪端","判断吸收或送出"],"exampleDiagram":null,"referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/10-1-electromotive-force"},{"title":"电阻：算式可以交叉检查","body":"\u003cp>理想电阻把电能转成热。关联参考方向下 u=Ri，所以 p=ui=i²R=u²/R。R&gt;0 时消耗功率非负。这里的平方式适用于电阻，不是任意元件都能用 u²/R。\u003c/p>\u003cp>例如 4 Ω 电阻通过 2 A 电流，压降为 8 V，耗散 16 W。若只改变参考箭头，变量的符号会相应变化，真实发热不会改变。\u003c/p>\u003cdiv class=\"equation\">p\u003csub>R\u003c/sub> = i²R = u²/R ≥ 0\u003c/div>","q":{"id":"c1-3","type":"number","prompt":"4 Ω电阻通过2 A电流，消耗功率是多少？","value":16,"unit":"W","explain":"p=i²R=2²×4=16 W。","hints":["电流要平方。"],"tag":"电阻功率"},"diagram":null,"widget":null,"intuition":"电阻把电能转成热。只知道电压和电阻时，可先用 i=u/R 算电流，再算 p=ui；与电阻功率公式的结果应一致。","conceptFlow":["先求电流","求电阻功率","两种方法核对"],"exampleDiagram":"series12","referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/10-1-electromotive-force"},{"title":"用单位和能量守恒收尾","body":"\u003cp>Ω×A=V，V×A=W。写出单位能发现把电流写成电压、把 u/R 写成 R/u 这类错误。在理想集中参数电路模型中，所有元件按吸收为正计算，瞬时功率的代数和为零。\u003c/p>\u003cp>功率平衡不代表每个元件都吸收相同功率，而是某些元件送出的总功率，等于其他元件当时吸收的总功率。电容、电感的吸收可能表现为储能。\u003c/p>","q":{"id":"c1-4","type":"choice","prompt":"把电路中所有元件按吸收功率为正相加，理想模型的结果应为？","options":["0 W","总电源电压","每个电阻功率都相等"],"answer":0,"explain":"电路满足能量守恒，发出的功率与吸收的功率平衡。","hints":[],"tag":"功率平衡"},"diagram":null,"widget":null,"intuition":"单位像给结果贴标签：电压是 V，电流是 A，功率是 W。整张电路中，各元件按同一约定算出的吸收功率相加应为零。","conceptFlow":["给结果写单位","统一功率符号","检查功率平衡"],"exampleDiagram":null,"referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/10-1-electromotive-force"}],"finale":{"intro":"一个12 V理想电压源与R₁=2 Ω、R₂=4 Ω串联。规定回路电流从电源正端流出，电阻电压按电流流入端为正。求电流、各电阻电压及功率，并检查平衡。","diagram":"series12","parts":[{"id":"c1-f1","type":"number","prompt":"回路电流 i","value":2,"unit":"A","explain":"串联总电阻为6 Ω，i=12/6=2 A。","hints":["先求串联总电阻。"],"tag":"计算与单位"},{"id":"c1-f2","type":"number","prompt":"R₁两端电压","value":4,"unit":"V","explain":"U₁=iR₁=2×2=4 V。","hints":[],"tag":"计算与单位"},{"id":"c1-f3","type":"number","prompt":"R₂消耗功率","value":16,"unit":"W","explain":"P₂=i²R₂=4×4=16 W。","hints":[],"tag":"计算与单位"},{"id":"c1-f4","type":"number","prompt":"电源的吸收功率","value":-24,"unit":"W","explain":"电流从电源正端流出，p源=−12×2=−24 W。","hints":["电源采用吸收为正的功率记法。"],"tag":"功率符号"}],"solution":["总电阻2+4=6 Ω，i=2 A；电阻压降分别4 V、8 V，满足12−4−8=0。","P₁=2²×2=8 W，P₂=2²×4=16 W，电源吸收功率−24 W。","功率和−24+8+16=0，单位、KVL和能量三个检查相互吻合。"],"takeaways":["负号需要连着参考方向解释。","功率公式先看参考关系，不能只看元件名字。"]}},{"id":"2","title":"元件模型与 KCL / KVL","group":"直流分析","minutes":"50–70","prior":"已学一轮，可复习","prereq":"参考方向、欧姆定律和功率的基本意义。","goals":["按节点写电流守恒","按回路写电压关系","认识独立源、受控源与模型适用范围"],"guides":["节点处的电流会不会凭空消失？","绕电路一圈，为什么电压变化要合起来为零？","理想电压源是不是任何时候电流都固定？"],"sections":[{"title":"三个基本模型分别约束什么","body":"\u003cp>电阻的关联电压电流满足 u=Ri。理想电压源固定两端电压，电流由外部电路决定；理想电流源固定支路电流，两端电压由外部电路决定。理想模型没有真实器件的功率、耐压等限制，实际选型还要查资料。\u003c/p>\u003cdiv class=\"equation\">电阻：u=Ri；电压源：u=U\u003csub>s\u003c/sub>；电流源：i=I\u003csub>s\u003c/sub>\u003c/div>\u003cp>短路要求两端电压为零，开路要求支路电流为零。短路电流不必为零，开路电压也不必为零。\u003c/p>","q":{"id":"c2-1","type":"choice","prompt":"理想12 V电压源接不同电阻时，固定的是？","options":["两端电压","支路电流","输出功率"],"answer":0,"explain":"电压源约束电压；负载改变时电流、功率可以改变。","hints":[],"tag":"源模型"},"diagram":null,"widget":null,"intuition":"理想电压源规定两端电压；理想电流源规定通过它的电流。电阻两端电压和通过它的电流则由 u=Ri 联系起来。","conceptFlow":["看元件是什么","明确固定的量","用外电路求另一量"],"exampleDiagram":null,"referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/10-3-kirchhoffs-rules"},{"title":"节点处写 KCL","body":"\u003cp>理想导线直接相连的点属于同一节点，即使导线拐弯很长，也不能多算节点。基尔霍夫电流定律KCL来自电荷守恒：流入节点的电流总和等于流出总和。\u003c/p>\u003cp>例如流入为3 A，流出有1 A和未知i，则3=1+i，得到i=2 A。也可以全部按流出为正写−3+1+i=0；两种记法一致就行。\u003c/p>\u003cdiv class=\"equation\">∑i\u003csub>流入\u003c/sub> = ∑i\u003csub>流出\u003c/sub>\u003c/div>","q":{"id":"c2-2","type":"number","prompt":"节点流入3 A，已知一支路流出1 A，另一支路流出多少？","value":2,"unit":"A","explain":"3=1+i，所以i=2 A。","hints":["先把流入、流出分别写在等号两侧。"],"tag":"KCL"},"diagram":null,"widget":null,"intuition":"节点可以想成几条道路的交会处。在集中参数电路模型里，节点不持续堆积电荷，因此选好流入流出方向后，流入总电流等于流出总电流。","conceptFlow":["找到节点","标出电流箭头","流入之和＝流出之和"],"exampleDiagram":"nodeFlow","referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/10-3-kirchhoffs-rules","tinyExample":"例如图中 3 A 流入，1 A 和未知电流 i 流出。先写 3=1+i，再得到 i=2 A。把 2 A 代回后，流出之和也是 3 A。"},{"title":"回路中写 KVL","body":"\u003cp>基尔霍夫电压定律KVL用于集中参数电路的电压约束。选定绕行方向，按电位升降写式。采用“电位升高为正”的记法时，经过电源从−到+写+U，经过电阻从+到−写−u。\u003c/p>\u003cp>例如12 V源驱动2 Ω和4 Ω串联，12−2i−4i=0。你也可以把全部项乘−1；不要把某一种符号记法当作唯一合法记法，关键是前后一致。\u003c/p>\u003cdiv class=\"equation\">沿闭合回路：∑电位变化 = 0\u003c/div>","q":{"id":"c2-3","type":"number","prompt":"12 V源、2 Ω和4 Ω串联，回路电流是多少？","value":2,"unit":"A","explain":"12−(2+4)i=0，i=2 A。","hints":[],"tag":"KVL"},"diagram":null,"widget":null,"intuition":"沿闭合回路走一圈，最后回到起点，电位变化总和为零。穿过电源或电阻时，要按照经过的正负端确定升高还是降低。","conceptFlow":["选一个绕行方向","逐个判断升降","一圈电位变化和为零"],"exampleDiagram":"series12","referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/10-3-kirchhoffs-rules","tinyExample":"例如 12 V 电源串联 2 Ω 和 4 Ω，先求电流 i=12/(2+4)=2 A。沿电源升压、再经过两个电阻降压：12−4−8=0 V。"},{"title":"受控源要同时看输出与控制量","body":"\u003cp>受控源的数值由电路中另一个电压或电流决定。先看输出是电压源还是电流源，再看等式右边由什么控制：uₒ=μuₓ是电压控制电压源；iₒ=guₓ是电压控制电流源；uₒ=riₓ是电流控制电压源；iₒ=βiₓ是电流控制电流源。\u003c/p>\u003cp>控制关系属于模型的一部分，分析和等效时不能随便删除。器件被叫作“放大器”不能代替对控制关系的判断。\u003c/p>","q":{"id":"c2-4","type":"choice","prompt":"iₒ=g·uₓ 的受控源属于？","options":["电压控制电流源","电流控制电压源","电压控制电压源"],"answer":0,"explain":"输出是电流，控制量是电压，因此是VCCS。","hints":["分别看左边输出和右边控制量。"],"tag":"受控源"},"diagram":null,"widget":null,"intuition":"受控源有两个部分：它输出什么，以及输出由电路中的哪个量控制。找到控制量后，还要保留两者之间的关系式。","conceptFlow":["认清输出类型","找到控制量","写下控制关系"],"exampleDiagram":null,"referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/10-3-kirchhoffs-rules"},{"title":"方程数量与结果检查","body":"\u003cp>对于连通电路，若按明确约定数出n个节点、b条支路，独立KCL方程通常取n−1个，独立KVL方程为b−n+1个。这里是在讨论连通网络拓扑，使用前要明确支路的定义。\u003c/p>\u003cp>求解后至少检查：支路电流单位为A、压降单位为V，节点电流平衡，回路电压平衡。遇到负值先解释方向，再判断是否算错。\u003c/p>","q":{"id":"c2-5","type":"number","prompt":"连通网络有4个节点，独立KCL方程可取几个？","value":3,"unit":"1","explain":"n−1=4−1=3。","hints":[],"tag":"方程数量"},"diagram":null,"widget":null,"intuition":"未知量有几个，通常就需要相应数量的独立方程。列完以后，把求出的电流和电压代回 KCL、KVL 检查。","conceptFlow":["数独立未知量","写独立方程","代回原电路检查"],"exampleDiagram":null,"referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/10-3-kirchhoffs-rules"}],"finale":{"intro":"12 V理想电压源经R₁=2 Ω接到节点a；a经R₂=6 Ω和R₃=3 Ω分别接地，两个电阻并联。求节点电压和支路电流，再检查KCL、KVL。","diagram":"parallel12","parts":[{"id":"c2-f1","type":"number","prompt":"节点a对地电压","value":6,"unit":"V","explain":"6 Ω与3 Ω并联为2 Ω，与前面的2 Ω分压得到6 V。","hints":["先认清两只并联电阻接在同一对节点上。"],"tag":"计算与单位"},{"id":"c2-f2","type":"number","prompt":"电源流出的电流","value":3,"unit":"A","explain":"总电阻2+2=4 Ω，电流12/4=3 A。","hints":[],"tag":"计算与单位"},{"id":"c2-f3","type":"number","prompt":"流过6 Ω支路的电流","value":1,"unit":"A","explain":"6/6=1 A。","hints":[],"tag":"计算与单位"},{"id":"c2-f4","type":"number","prompt":"流过3 Ω支路的电流","value":2,"unit":"A","explain":"6/3=2 A。","hints":[],"tag":"计算与单位"}],"solution":["R₂∥R₃=6×3/(6+3)=2 Ω，总电阻4 Ω，源电流3 A。","Uₐ=12−3×2=6 V；两并联支路电流分别1 A、2 A。","KCL：3=1+2；左侧回路KVL：12−3×2−6=0。"],"takeaways":["KCL看电流怎样分，KVL看沿回路电位怎样变化。","源模型、元件关系与守恒方程共同决定结果。"]}},{"id":"3","title":"电阻与电源等效变换","group":"直流分析","minutes":"45–65","prior":"已学一轮，可复习","prereq":"串并联、KCL/KVL及源模型。","goals":["按连接节点判断串并联","理解端口等效的边界","正确变换电压源与电流源"],"guides":["外部负载一样时，什么样的两个网络才叫等效？","两个电阻画在一上一下，就一定是并联吗？","电源变换后，电流源箭头应该朝哪里？"],"sections":[{"title":"等效是从端口看进去","body":"\u003cp>端口是网络与外部连接的两个端点。端口等效要求：外接相同负载时，两网络的端口电压和电流关系一致。内部元件的电流、功率不必一一相同。\u003c/p>\u003cp>因此，可以用简化网络计算负载，却不能用简化后某个“内部电阻”的功率冒充原网络里某个器件的损耗。这也是以后戴维南等效的基本想法。\u003c/p>","q":{"id":"c3-1","type":"choice","prompt":"两个网络端口等效，必然相同的是？","options":["相同负载下的端口电压、电流","每个内部元件的功率","内部支路数量"],"answer":0,"explain":"端口等效保留外部电压电流关系，内部不必相同。","hints":[],"tag":"端口等效"},"diagram":null,"widget":null,"intuition":"等效像把复杂盒子换成简单盒子：只要从外面两个端子看，接同一个负载时电压和电流关系相同，就称端口等效。盒子内部并不一定一样。","conceptFlow":["选定两个端口","接相同负载","比较端口电压电流"],"exampleDiagram":"sourceTransform","referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/10-2-resistors-in-series-and-parallel"},{"title":"串并联由节点关系决定","body":"\u003cp>串联支路通过相同电流，连接处没有其他分流路径，总电阻R=R₁+R₂。并联电阻连接在同一对节点之间，端电压相同，总电导相加。\u003c/p>\u003cdiv class=\"equation\">\u003cspan class=\"fraction\" aria-label=\"分数\">\u003cspan>1\u003c/span>\u003cspan>R\u003csub>并\u003c/sub>\u003c/span>\u003c/span> = 1/R₁ + 1/R₂；两只时 R\u003csub>并\u003c/sub> = R₁R₂/(R₁+R₂)\u003c/div>\u003cp>例如3 Ω与6 Ω并联为2 Ω，小于任一支路电阻。把R₁+R₂用于并联，或者仅凭图形远近判断连接，都会出错。\u003c/p>","q":{"id":"c3-2","type":"number","prompt":"3 Ω与6 Ω并联，等效电阻是多少？","value":2,"unit":"Ω","explain":"3×6/(3+6)=2 Ω。","hints":["并联先加电导，或使用两电阻并联式。"],"tag":"并联"},"diagram":null,"widget":null,"intuition":"判断串并联时别看画得近不近：串联要看连接点有没有其他分支；并联要看元件两端是不是分别接到同一对节点。","conceptFlow":["先标节点","检查是否有分叉","再判断串联或并联"],"exampleDiagram":"parallel12","referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/10-2-resistors-in-series-and-parallel","tinyExample":"两只电阻若都接在节点 a 和节点 b 之间，就是并联。比如 3 Ω 与 6 Ω 并联，等效电阻为 2 Ω，比两只电阻各自都小。"},{"title":"分压与分流的使用条件","body":"\u003cp>串联两电阻可按电阻比例分压：U₁=U·R₁/(R₁+R₂)。并联两电阻可按电导比例分流：i₁=I·R₂/(R₁+R₂)。小电阻支路分到较大电流。\u003c/p>\u003cp>公式来自KVL、KCL和欧姆定律，使用前必须确认真的串联或并联。如果分压中点接上负载，需要重新计算该处等效电阻，不能照搬空载分压结果。\u003c/p>","q":{"id":"c3-3","type":"number","prompt":"总电流3 A流入3 Ω与6 Ω并联网络，3 Ω支路电流是多少？","value":2,"unit":"A","explain":"i₃Ω=3×6/(3+6)=2 A。","hints":["小电阻支路分到更多电流。"],"tag":"分流"},"diagram":null,"widget":null,"intuition":"串联分压是同一电流经过不同电阻；并联分流是相同电压加在不同支路。先确认连接关系，再选对应公式。","conceptFlow":["先判断串并联","串联看分压","并联看分流"],"exampleDiagram":"series12","referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/10-2-resistors-in-series-and-parallel","tinyExample":"12 V 电源接 2 Ω 与 4 Ω 串联时，电流是 2 A；2 Ω 上是 4 V，4 Ω 上是 8 V，总压降刚好 12 V。"},{"title":"电源变换保留端口关系","body":"\u003cp>理想电压源Uₛ串联电阻R，可以等效为电流源Iₛ=Uₛ/R并联同一个R。电流源箭头指向原电压源正端对应的端口。\u003c/p>\u003cdiv class=\"equation\">U\u003csub>端\u003c/sub> = Uₛ − i\u003csub>负载\u003c/sub>R；Iₛ = Uₛ/R\u003c/div>\u003cp>例如12 V串3 Ω，转换为4 A并3 Ω。只变理想源而不处理它的串/并电阻，不是这个变换。受控源也不能盲目删除控制变量，需保持或正确重新表达控制关系和端口关系。\u003c/p>","q":{"id":"c3-4","type":"number","prompt":"12 V电压源串联3 Ω，对应的并联电流源大小是多少？","value":4,"unit":"A","explain":"Iₛ=12/3=4 A，电阻仍为3 Ω。","hints":["不要把变换电流误当成接入负载后的负载电流。"],"tag":"电源变换"},"diagram":"sourceTransform","widget":null,"intuition":"电源变换是换一种更方便的端口模型。电压源串联电阻可以换成电流源并联同一电阻，箭头与电压正端的对应关系不能画反。","conceptFlow":["认出串联电压源","换成并联电流源","核对箭头与端口"],"exampleDiagram":null,"referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/10-2-resistors-in-series-and-parallel"}],"finale":{"intro":"12 V理想电压源串联内阻3 Ω，向6 Ω负载供电。先用原电路求负载电压电流，再把供电部分变换为电流源网络核对。","diagram":"thevenin12","parts":[{"id":"c3-f1","type":"number","prompt":"原电路负载电流","value":1.3333333333333333,"unit":"A","explain":"12/(3+6)=4/3 A。","hints":[],"tag":"计算与单位"},{"id":"c3-f2","type":"number","prompt":"负载电压","value":8,"unit":"V","explain":"(4/3)×6=8 V。","hints":[],"tag":"计算与单位"},{"id":"c3-f3","type":"number","prompt":"变换后3 Ω与6 Ω并联的等效电阻","value":2,"unit":"Ω","explain":"3∥6=2 Ω。","hints":[],"tag":"计算与单位"},{"id":"c3-f4","type":"number","prompt":"变换后的负载电流","value":1.3333333333333333,"unit":"A","explain":"总源电流4 A按并联分流，负载电流4×3/(3+6)=4/3 A。","hints":[],"tag":"计算与单位"}],"solution":["原电路总电阻9 Ω，负载电流4/3 A，负载电压8 V。","供电部分变为4 A电流源并3 Ω。接入6 Ω后，总并联电阻2 Ω，所以端口电压4×2=8 V。","负载电流8/6=4/3 A，与原电路相同。电流源的4 A不是负载电流。"],"takeaways":["判断串并联看节点，不看外形。","等效保留端口行为，变换源电流不一定等于负载电流。"]}},{"id":"6","title":"节点法与网孔法","group":"直流分析","minutes":"60–80","prior":"核心已学，计算需巩固","prereq":"KCL/KVL、欧姆定律、联立方程。","goals":["用节点电压表示支路电流","处理参考节点电压源与超节点","区分网孔电流和实际支路电流"],"guides":["为什么选一个参考节点能减少未知量？","两节点之间有理想电压源时怎样写KCL？","共用电阻的电流为什么可能是两个网孔电流之差？"],"sections":[{"title":"节点法的未知量是电位","body":"\u003cp>先选一个节点作0 V参考点，其余节点电压都相对它定义。电阻连接a、b时，规定从a到b为正的电流是(Vₐ−Vᵦ)/R，不能写成R/(Vₐ−Vᵦ)。\u003c/p>\u003cdiv class=\"equation\">i\u003csub>a→b\u003c/sub> = \u003cspan class=\"fraction\" aria-label=\"分数\">\u003cspan>V\u003csub>a\u003c/sub> − V\u003csub>b\u003c/sub>\u003c/span>\u003cspan>R\u003c/span>\u003c/span>\u003c/div>\u003cp>对未知节点写KCL，再代入电阻关系。比如a经2 Ω接已知10 V节点、经3 Ω接地： (Vₐ−10)/2+Vₐ/3=0。方程每一项都是电流。\u003c/p>","q":{"id":"c6-1","type":"number","prompt":"a为6 V，b为2 V，之间电阻2 Ω。从a到b的电流是多少？","value":2,"unit":"A","explain":"(6−2)/2=2 A。","hints":[],"tag":"节点电流"},"diagram":null,"widget":null,"intuition":"把参考节点当作电位的零刻度。其他节点电压都是相对它测量；一条电阻支路电流由两端电位差除以电阻得到。","conceptFlow":["选参考节点","给未知节点命名","逐支路写电流"],"exampleDiagram":"twoNodes","referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/10-3-kirchhoffs-rules","tinyExample":"例如节点 a 是 6 V、节点 b 是 2 V，中间接 2 Ω 电阻。规定从 a 到 b 为正，电流为 (6−2)/2=2 A；若结果是负数，实际方向与箭头相反。"},{"title":"自导、互导来自展开KCL","body":"\u003cp>a经R₁接地、经R₂连接b时，KCL展开为(1/R₁+1/R₂)Vₐ−(1/R₂)Vᵦ=注入a的源电流。自己的电位系数是相连电导之和，邻接节点项出现负电导。\u003c/p>\u003cp>这不是另外一条物理定律，而是把各支路(Vₐ−V邻)/R整理后的结果。记不清符号时，回到逐支路KCL比死背矩阵更可靠。\u003c/p>","q":{"id":"c6-2","type":"choice","prompt":"节点方程中−Vᵦ/R项主要来自？","options":["连接a、b电阻上的(Vₐ−Vᵦ)/R","所有节点电压必须为正","电流不能反向"],"answer":0,"explain":"负号来自两端电位相减。","hints":[],"tag":"节点方程符号"},"diagram":null,"widget":null,"intuition":"所谓自导和互导，是把节点方程里的同类项整理到一起得到的系数；忘了记法就回到“这条支路两端电位差”重新列式。","conceptFlow":["先逐支路列KCL","展开并合并同类项","核对每项单位"],"exampleDiagram":"twoNodes","referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/10-3-kirchhoffs-rules"},{"title":"理想电压源与超节点","body":"\u003cp>若理想电压源一端接参考点，它另一端电压可直接由极性确定。若两个未知节点a、b之间接电压源，则将两点及电源视为超节点，对边界外支路写总KCL，再补电压约束Vₐ−Vᵦ=Uₛ。\u003c/p>\u003cp>内部电压源电流在把两个节点KCL相加时抵消，所以不用先求它。超节点不能代替电压源约束；两条信息缺一不可。\u003c/p>","q":{"id":"c6-3","type":"number","prompt":"电压源正端接地、负端接a，源值12 V。Vₐ是多少？","value":-12,"unit":"V","explain":"0−Vₐ=12，所以Vₐ=−12 V。","hints":["电压源约束的是正端电位减负端电位。"],"tag":"电源极性"},"diagram":null,"widget":null,"intuition":"两个未知节点之间夹着理想电压源时，电源支路电流不能直接用电阻公式写。把两节点当作超节点写边界 KCL，再补上电压源约束。","conceptFlow":["圈住超节点","对外边界写KCL","补上电压约束"],"exampleDiagram":null,"referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/10-3-kirchhoffs-rules"},{"title":"网孔法用KVL组织未知量","body":"\u003cp>对于平面电路，可给各小网孔假设绕行电流。若相邻网孔都选顺时针，在共用电阻中方向相反，支路电流要按指定方向写为I₁−I₂或I₂−I₁。网孔电流是辅助未知量，不总等于某条支路电流。\u003c/p>\u003cp>例如网孔方程4I₁−2I₂=6、−2I₁+6I₂=0，解得I₁=1.8 A、I₂=0.6 A，共用2 Ω电阻向下电流1.2 A。方程各项单位为V。\u003c/p>","q":{"id":"c6-4","type":"number","prompt":"I₁=1.8 A向下通过共用支路，I₂=0.6 A向上。支路向下参考电流是多少？","value":1.2,"unit":"A","explain":"i=I₁−I₂=1.2 A。","hints":[],"tag":"网孔与支路"},"diagram":null,"widget":null,"intuition":"网孔电流是为列方程假设的绕行电流。两个同向绕行的相邻网孔经过共用支路时，支路电流是两个网孔电流之差。","conceptFlow":["给每个网孔选方向","共用支路取电流差","沿回路写KVL"],"exampleDiagram":null,"referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/10-3-kirchhoffs-rules"},{"title":"先选方法，再回代","body":"\u003cp>未知节点少时节点法可能更省；网孔少时网孔法也可能方便。两者都依赖电路守恒关系，并结合元件关系。不要认为只能用一种方法。\u003c/p>\u003cp>本题如果你列对方程但算错，首先把数值代回原方程。若5I₁−3I₂=10，而你代入得到4.8，就能立刻知道求解有偏差。计算器可以帮算数，不能替你决定方程。\u003c/p>","q":{"id":"c6-5","type":"choice","prompt":"节点法与网孔法主要分别依据？","options":["KCL与KVL","都只用欧姆定律","功率定律与分压公式"],"answer":0,"explain":"节点法主要组织KCL，网孔法主要组织KVL，欧姆定律连接电压电流。","hints":[],"tag":"方法依据"},"diagram":null,"widget":null,"intuition":"节点法通常围绕节点电压列式，网孔法围绕网孔电流列式。可以先数一数哪种未知量更少，算完再代回原方程。","conceptFlow":["比较未知量个数","选择方便的方法","代回原方程"],"exampleDiagram":null,"referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/10-3-kirchhoffs-rules"}],"finale":{"intro":"10 V源正端为c，负端接地。2 Ω接c—a；3 Ω接a—b；6 Ω接a—地；另一个3 Ω接b—地。取a、b对地电压为未知量，求节点电压与支路电流。","diagram":"twoNodes","parts":[{"id":"c6-f1","type":"number","prompt":"节点a电压","value":6,"unit":"V","explain":"由3Vₐ−Vᵦ=15、2Vᵦ−Vₐ=0得到Vₐ=6 V。","hints":["a节点：(Vₐ−10)/2+(Vₐ−Vᵦ)/3+Vₐ/6=0。","b节点：(Vᵦ−Vₐ)/3+Vᵦ/3=0。"],"tag":"计算与单位"},{"id":"c6-f2","type":"number","prompt":"节点b电压","value":3,"unit":"V","explain":"由2Vᵦ=Vₐ得到Vᵦ=3 V。","hints":[],"tag":"计算与单位"},{"id":"c6-f3","type":"number","prompt":"从c流向a的电流","value":2,"unit":"A","explain":"(10−6)/2=2 A。","hints":[],"tag":"计算与单位"},{"id":"c6-f4","type":"number","prompt":"从a流向b的电流","value":1,"unit":"A","explain":"(6−3)/3=1 A。","hints":[],"tag":"计算与单位"}],"solution":["a节点KCL乘6：3(Vₐ−10)+2(Vₐ−Vᵦ)+Vₐ=0，得到3Vₐ−Vᵦ=15。","b节点KCL：2Vᵦ−Vₐ=0。联立得到Vₐ=6 V、Vᵦ=3 V。","a流向地的6 Ω电流1 A，流向b为1 A，来自c为2 A，KCL：2=1+1。b经3 Ω流向地也是1 A。"],"takeaways":["电流表达式先定方向，再减电位。","列式正确和算式正确分别检查；回代能定位计算问题。"]}},{"id":"7","title":"叠加定理与戴维南","group":"直流分析","minutes":"60–85","prior":"当前进度：讲末综合题","prereq":"KCL、串并联、节点法和端口等效。","goals":["正确处理独立源置零和受控源","统一方向叠加电压电流","求出戴维南参数并分析负载变化"],"guides":["多个源共同作用时，怎样分开计算再合起来？","电源置零究竟把哪个物理量设成零？","负载改变时，怎样避免重新分析整个内部网络？"],"sections":[{"title":"置零的是源值","body":"\u003cp>理想独立电压源置零，要求它两端u=0，因此用短路替换；理想独立电流源置零，要求i=0，因此用开路替换。短路仍可能有电流，开路仍可能有电压。\u003c/p>\u003cp>叠加中每次保留一个独立源，其余独立源置零；电阻保留，受控源及控制关系也保留。受控源不属于可以随便关掉的独立激励。\u003c/p>","q":{"id":"c7-1","type":"choice","prompt":"让一个独立电压源单独作用时，其余理想独立电流源应怎样处理？","options":["开路","短路","与电阻一起删除"],"answer":0,"explain":"电流源置零要求支路电流为0，所以开路。","hints":["先问置零的是电压还是电流。"],"tag":"源置零"},"diagram":null,"widget":null,"intuition":"叠加时“关掉”独立源，是把它的数值设为零：零电压源等效短路，零电流源等效开路。电阻和受控源不能一起删掉。","conceptFlow":["保留一个独立源","其余独立源置零","电阻及受控源保留"],"exampleDiagram":"zeroSources","referenceUrl":"https://ocw.mit.edu/courses/6-071j-introduction-to-electronics-signals-and-measurement-spring-2006/pages/lecture-notes/","tinyExample":"另举一个例子：假设电路里有 12 V 电压源和 1 A 电流源，分析 12 V 电压源单独作用时，保留电压源，把电流源改为开路。原来的电阻仍留在原位置。"},{"title":"叠加必须统一参考方向","body":"\u003cp>线性电路中，分响应可以代数相加。假设同一支路都规定向下为正，两个源单独作用分别产生0.8 A和−0.3 A，总电流为0.5 A。不能把负值先取绝对值。\u003c/p>\u003cp>对电压也是如此：统一Uₐᵦ=Vₐ−Vᵦ。即使某个分电路中支路电流换了方向，端口电压仍可能为正；要分别看所求量的定义，不能由“电流反向”直接判“电压为负”。\u003c/p>\u003cdiv class=\"equation\">i = i₁ + i₂；U\u003csub>ab\u003c/sub> = U\u003csub>ab,1\u003c/sub> + U\u003csub>ab,2\u003c/sub>\u003c/div>","q":{"id":"c7-2","type":"number","prompt":"同一向下参考方向的两个分电流为0.8 A、−0.3 A，总电流是多少？","value":0.5,"unit":"A","explain":"0.8+(−0.3)=0.5 A，实际向下。","hints":["保留负号作代数加法。"],"tag":"叠加方向"},"diagram":null,"widget":null,"intuition":"先统一所求电流箭头或电压极性，再分别算每个独立源的贡献。某次结果为负，说明它与选定参考方向相反，最后连同正负号相加。","conceptFlow":["统一参考方向","分别计算各源贡献","带符号相加"],"exampleDiagram":"capstone7","referenceUrl":"https://ocw.mit.edu/courses/6-071j-introduction-to-electronics-signals-and-measurement-spring-2006/pages/lecture-notes/","tinyExample":"若一个电源单独产生向下 1 A，另一个单独产生向上 0.25 A，统一规定向下为正，就写 1+(−0.25)=0.75 A。"},{"title":"功率重新根据总响应计算","body":"\u003cp>电阻功率是i²R。若i=i₁+i₂，则(i₁+i₂)²中存在2i₁i₂交叉项，所以不能把分电路功率直接相加。\u003c/p>\u003cp>例如6 Ω电阻的分电流分别1 A与0.25 A，总电流1.25 A，实际功率9.375 W；6 W与0.375 W的直接和只有6.375 W。先求总电流，再算真实功率。\u003c/p>","q":{"id":"c7-3","type":"number","prompt":"6 Ω电阻的分电流为+0.5 A和−0.5 A，两源共同作用时功率是多少？","value":0,"unit":"W","explain":"总电流为0，因此功率为0 W。分电路功率不能直接相加。","hints":["先求总电流。"],"tag":"功率叠加"},"diagram":null,"widget":null,"intuition":"电流可以先叠加，但电阻功率要用总电流重新计算：因为总电流的平方会包含交叉项，不能直接相加各次分电路的功率。","conceptFlow":["各次电流带符号相加","得到总电流","再计算总功率"],"exampleDiagram":"series12","referenceUrl":"https://ocw.mit.edu/courses/6-071j-introduction-to-electronics-signals-and-measurement-spring-2006/pages/lecture-notes/","tinyExample":"例如 6 Ω 电阻中两个分电流分别为向下 1 A、向上 0.25 A，总电流为 0.75 A。原电路功率是 0.75²×6=3.375 W。"},{"title":"戴维南等效：两个参数概括端口","body":"\u003cp>对满足条件的线性含源二端电阻网络，负载端口可以用电压源UTh串电阻RTh表示。负载接回后，端口电压电流与原网络一致，内部损耗不保证一样。\u003c/p>\u003cp>先取下负载，保留供电网络内部支路和正常源，求开路电压Uoc，它就是UTh。取下负载不意味着内部电路处处没有电流。\u003c/p>\u003cdiv class=\"equation\">U\u003csub>Th\u003c/sub> = U\u003csub>oc\u003c/sub>；i\u003csub>L\u003c/sub> = \u003cspan class=\"fraction\" aria-label=\"分数\">\u003cspan>U\u003csub>Th\u003c/sub>\u003c/span>\u003cspan>R\u003csub>Th\u003c/sub> + R\u003csub>L\u003c/sub>\u003c/span>\u003c/span>\u003c/div>","q":{"id":"c7-4","type":"choice","prompt":"求开路电压时，正确操作是？","options":["取下负载，原供电网络的源正常保留","所有独立源同时置零","连同内部电阻一起去掉"],"answer":0,"explain":"开路是负载端口不输出电流，内部仍保留原激励。","hints":[],"tag":"开路电压"},"diagram":"thevenin10","widget":"load","intuition":"把外部负载暂时拿掉，从两个接线端看进去，复杂网络可以用一个等效电压源串联一个等效电阻表示。开路电压给出等效电压。","conceptFlow":["取下外部负载","求开路电压与等效电阻","接回负载计算"],"exampleDiagram":null,"referenceUrl":"https://ocw.mit.edu/courses/6-071j-introduction-to-electronics-signals-and-measurement-spring-2006/pages/lecture-notes/","tinyExample":"例如开路电压为 10 V、等效电阻为 2 Ω，接上 3 Ω 负载后，电流为 10/(2+3)=2 A，负载电压为 2×3=6 V。"},{"title":"求等效电阻，再检查负载结果","body":"\u003cp>对于仅含独立源和电阻的网络，取下负载，将所有独立源同时置零，从端口计算等效电阻。含受控源时保留受控源，必要时接测试源，用端口电压/电流求RTh。\u003c/p>\u003cp>此前双电压源练习得到UTh=10 V、RTh=2 Ω。RL从6 Ω变3 Ω时，i从1.25 A变2 A，UL从7.5 V变6 V。负载电流增加，内部等效电阻压降也增加，所以开路10 V不保证带载仍10 V。\u003c/p>","q":{"id":"c7-5","type":"number","prompt":"UTh=10 V，RTh=2 Ω，RL=3 Ω，负载电压是多少？","value":6,"unit":"V","explain":"i=10/(2+3)=2 A，UL=2×3=6 V。","hints":["接回负载后，两个电阻串联分压。"],"tag":"负载效应"},"diagram":null,"widget":null,"intuition":"求等效电阻时，从负载原来的两个端点往里看；独立源置零，内部电阻保留。如果有受控源，保留它，必要时在端口加测试源。","conceptFlow":["从负载端向里看","独立源置零","保留受控源并求电阻"],"exampleDiagram":"thevenin10","referenceUrl":"https://ocw.mit.edu/courses/6-071j-introduction-to-electronics-signals-and-measurement-spring-2006/pages/lecture-notes/"}],"finale":{"intro":"接着你在对话中尚未提交的讲末题：12 V源上正下负，经R₁=3 Ω接a；a经内部R₂=6 Ω接b；1 A理想电流源从a流向b；负载RL=6 Ω也接a、b，b=0 V。规定负载电流向下为正、UL=Vₐ−Vᵦ。先自己完整尝试，再逐步查看提示。","diagram":"capstone7","parts":[{"id":"c7-f1","type":"number","prompt":"仅12 V源作用时的负载分电流","value":1,"unit":"A","explain":"电流源开路，R₂∥RL=3 Ω，Va=6 V，所以iL₁=1 A。","hints":["电流源置零后开路；内部R₂仍保留。","先算6 Ω∥6 Ω，再分压。"],"tag":"源置零"},{"id":"c7-f2","type":"number","prompt":"仅1 A向下电流源作用时的负载分电流（向下为正）","value":-0.25,"unit":"A","explain":"电压源短路，a对地有3、6、6 Ω三支路，总电导2/3 S。Va=−1/(2/3)=−1.5 V，iL₂=−1.5/6=−0.25 A。","hints":["电压源短路后，三个电阻都从a接地。","KCL写Va/3+Va/6+Va/6+1=0。"],"tag":"叠加方向"},{"id":"c7-f3","type":"number","prompt":"接RL=6 Ω时的总负载电流","value":0.75,"unit":"A","explain":"iL=1+(−0.25)=0.75 A。","hints":[],"tag":"计算与单位"},{"id":"c7-f4","type":"number","prompt":"只取下RL后的开路电压Uoc","value":6,"unit":"V","explain":"(Va−12)/3+Va/6+1=0，得到Va=6 V。","hints":["内部R₂=6 Ω不能取下。","本题改为向下电流源，不能套用之前双电压源题的10 V。"],"tag":"开路电压"},{"id":"c7-f5","type":"number","prompt":"戴维南等效电阻RTh","value":2,"unit":"Ω","explain":"电压源短路、电流源开路，留下3 Ω∥6 Ω=2 Ω。","hints":[],"tag":"等效电阻"},{"id":"c7-f6","type":"number","prompt":"RL=6 Ω时负载实际功率","value":3.375,"unit":"W","explain":"iL=6/(2+6)=0.75 A，UL=4.5 V，PL=0.75²×6=3.375 W。","hints":["用总电流求功率。"],"tag":"功率叠加"},{"id":"c7-f7","type":"number","prompt":"RL改为2 Ω后的负载电压","value":3,"unit":"V","explain":"iL=6/(2+2)=1.5 A，UL=1.5×2=3 V。","hints":[],"tag":"负载效应"}],"solution":["叠加：电压源单独作用时Va=6 V，iL₁=1 A；电流源单独作用时Va=−1.5 V，iL₂=−0.25 A。总iL=0.75 A。","开路时只取下RL，保留R₂。KCL：(Va−12)/3+Va/6+1=0，所以Uoc=6 V。","所有独立源置零后RTh=3∥6=2 Ω。接回6 Ω，iL=6/8=0.75 A、UL=4.5 V，和叠加结果一致。","负载功率PL=0.75²×6=3.375 W。换RL=2 Ω后iL=1.5 A、UL=3 V。","原网络带RL=6 Ω时源流出(12−4.5)/3=2.5 A；内部电阻0.75 A、负载0.75 A和向下源1 A相加为2.5 A，KCL再次成立。"],"takeaways":["每个分响应都保持同一个参考方向。","取下负载、独立源置零是两种不同操作。","总电流、戴维南结果和KCL应彼此吻合。"]}},{"id":"9","title":"电容、电感与储能","group":"储能与暂态","minutes":"45–70","prior":"计划待学","prereq":"电压、电流、功率及基本导数直观概念。","goals":["把元件关系与储能机制联系起来","识别初始状态与稳态的不同","理解电压电流连续性的条件"],"guides":["电容为什么能暂时保存电能？","电容两端电压为什么通常不能突然变？","电感为什么会影响电流变化，而不仅仅影响电流大小？"],"sections":[{"title":"电容把状态存在电场里","body":"\u003cp>电容两极板间建立电场，电荷与两端电压满足q=Cu。C的单位是F，常用μF。关联参考方向下，i=C·du/dt：电流改变电荷积累，也就改变电压。\u003c/p>\u003cp>这说明电容电流和“电压变化速度”有关。电压保持不变时，理想电容电流为零；电压随时间增加时，在关联方向下电流为正。不是电压一大就一定有很大电流。\u003c/p>\u003cdiv class=\"equation\">q = Cu；i = C·du/dt；W\u003csub>C\u003c/sub> = ½Cu²\u003c/div>","q":{"id":"c9-1","type":"number","prompt":"100 μF电容两端电压10 V，储能是多少？","value":5,"unit":"mJ","explain":"W=0.5×100×10⁻⁶×10²=0.005 J=5 mJ。","hints":["把μF换成F；电压要平方。"],"tag":"储能与单位"},"diagram":null,"widget":null,"intuition":"电容的两块极板能储存等量异号电荷。电流使极板电荷改变，电容电压才随之改变；电压保持不变时，理想电容电流为零。","conceptFlow":["电流使电荷改变","电荷变化引起电压变化","能量存于电场"],"exampleDiagram":"rc","referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/10-5-rc-circuits","tinyExample":"例如理想电容的电压从 0 V 逐步升高，说明极板上的电荷在改变；如果最终电压保持不变，直流稳态下电容电流就是 0。"},{"title":"电感把状态存在磁场里","body":"\u003cp>线圈电流建立磁场。理想线性电感在关联参考方向下u=L·di/dt，L单位是H，常用mH。电流变化越快，所需电压越大；维持恒定电流时理想电感电压为零。\u003c/p>\u003cp>电感储能W=½Li²。实际线圈还有电阻、铁损、饱和和寄生参数，理想电感只是分析起点。断开感性电流的路径时，可能产生很高的电压，后续功率电路会学习续流和钳位。\u003c/p>\u003cdiv class=\"equation\">u = L·di/dt；W\u003csub>L\u003c/sub> = ½Li²\u003c/div>","q":{"id":"c9-2","type":"number","prompt":"50 mH电感通过2 A电流，储能是多少？","value":100,"unit":"mJ","explain":"W=0.5×0.05×2²=0.1 J=100 mJ。","hints":[],"tag":"储能与单位"},"diagram":null,"widget":null,"intuition":"电感电流产生磁场。要让电流变化，需要相应的电感电压；电流变化越快，所需的电压越大。","conceptFlow":["电流产生磁场","改变电流需要电压","能量存于磁场"],"exampleDiagram":"inductorDC","referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/10-5-rc-circuits"},{"title":"连续的是状态，条件要讲清","body":"\u003cp>由i=C·du/dt可知，在电流有限、没有冲激电流的普通换路情形中，电容电压不能突变：uC(0⁺)=uC(0⁻)。类似地，在电压有限、没有冲激电压时，电感电流不能突变。\u003c/p>\u003cp>电容电流、电感电压可以在换路后改变。不要把“状态通常连续”误读成“所有电压、电流都不能变”。若理想模型强制不相容的瞬时跳变，意味着需要考虑冲激或更真实的寄生模型，不能盲套简单结论。\u003c/p>","q":{"id":"c9-3","type":"choice","prompt":"普通有限激励换路中，通常连续的两个状态量是？","options":["电容电压和电感电流","电容电流和电感电压","所有元件电压和电流"],"answer":0,"explain":"电场和磁场状态对应的量，在上述条件下连续。","hints":["分别从i=Cdu/dt、u=Ldi/dt看突变需要什么。"],"tag":"换路连续性"},"diagram":null,"widget":null,"intuition":"普通有限电流条件下，电容电压刚切换时连续；普通有限电压条件下，电感电流刚切换时连续。先找换路前的值，作为换路后的初值。","conceptFlow":["求换路前状态","保留连续的状态量","再分析换路后"],"exampleDiagram":"rc","referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/10-5-rc-circuits","tinyExample":"例如切换前电容电压为上正下负 6 V，在普通有限电流条件下，切换刚完成时仍是 6 V；后面它可以逐渐变化。"},{"title":"直流稳态和刚换路时分别处理","body":"\u003cp>在已经达到有限直流稳态的电路中，duC/dt=0，理想电容可视为开路；diL/dt=0，理想电感可视为短路。这个“直流稳态”前提不能省掉。\u003c/p>\u003cp>刚换路时，先找换路前的状态，再保留uC(0⁺)或iL(0⁺)。例如原本充到6 V的电容，不能在换路瞬间就当成0 V短路。理想电感直接跨恒压源可能持续爬升电流，也就不存在有限直流稳态。\u003c/p>","q":{"id":"c9-4","type":"choice","prompt":"已充到6 V的电容经电阻开始放电，普通换路后瞬间uC(0⁺)为？","options":["6 V","0 V","由电阻大小立即决定"],"answer":0,"explain":"电容原有电压在有限电流换路瞬间连续。","hints":[],"tag":"初始状态"},"diagram":null,"widget":null,"intuition":"先分清时间：稳定很久的直流电路中，理想电容视作开路、理想电感视作短路；刚换路时先保留电容电压或电感电流。","conceptFlow":["先问所处时刻","稳态判断开短路","刚换路保留状态"],"exampleDiagram":"rc","referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/10-5-rc-circuits"}],"finale":{"intro":"分别分析三个独立情形：①220 μF电容充到6 V；②100 mH理想电感通过0.5 A；③12 V源经6 Ω电阻与理想电感串联，已经达到直流稳态。","diagram":null,"parts":[{"id":"c9-f1","type":"number","prompt":"情形①电容的电荷量","value":1.32,"unit":"mC","explain":"q=220×10⁻⁶×6=0.00132 C=1.32 mC。","hints":[],"tag":"计算与单位"},{"id":"c9-f2","type":"number","prompt":"情形①电容储能","value":3.96,"unit":"mJ","explain":"0.5×220×10⁻⁶×6²=0.00396 J。","hints":[],"tag":"计算与单位"},{"id":"c9-f3","type":"number","prompt":"情形②电感储能","value":12.5,"unit":"mJ","explain":"0.5×0.1×0.5²=0.0125 J。","hints":[],"tag":"计算与单位"},{"id":"c9-f4","type":"number","prompt":"情形③稳态电流","value":2,"unit":"A","explain":"已达到稳态，理想电感压降为0，电流12/6=2 A。","hints":[],"tag":"计算与单位"}],"solution":["电容电荷q=Cu=1.32 mC，能量W=½Cu²=3.96 mJ。","电感能量W=½Li²=12.5 mJ。能量单位是J，不是W。","串联RL达到直流稳态后，电感相当于理想短路，电阻承受12 V，电流2 A；实际线圈电阻会改变这个结果。"],"takeaways":["电容关注电压及其变化，电感关注电流及其变化。","先分清刚换路和已稳态，再决定采用什么等效。"]}},{"id":"10","title":"一阶电路与时间常数","group":"储能与暂态","minutes":"60–80","prior":"计划待学","prereq":"电容电感的状态关系，指数函数的基本意义。","goals":["用初值、终值、时间常数写响应","解释电容电压和电感电流随时间变化","用波形核对快慢与极限"],"guides":["为什么充电初期快、后期慢？","时间常数改变的是最终电压，还是变化快慢？","带着初始电压接到新电源，怎样统一计算？"],"sections":[{"title":"先把一阶响应想成趋近过程","body":"\u003cp>含一个独立储能状态的线性电路，在普通条件下会以指数方式接近新的稳态。对于稳定的一阶过程，把状态记作x，它从初始x(0⁺)向终值x(∞)变化。\u003c/p>\u003cdiv class=\"equation\">x(t) = x(∞) + [x(0⁺) − x(∞)]e\u003csup>−t/τ\u003c/sup>\u003c/div>\u003cp>t=0时指数为1，公式回到初值；t趋大指数趋0，公式回到终值。用这两个极限检查，比仅背“充电式”“放电式”更可靠。\u003c/p>","q":{"id":"c10-1","type":"choice","prompt":"通用式中t=0时，应得到？","options":["x(0⁺)","x(∞)","0"],"answer":0,"explain":"把e⁰=1代入，初值必须恢复。","hints":[],"tag":"响应极限"},"diagram":null,"widget":null,"intuition":"一阶响应可以先抓三个数：一开始是多少、最终趋向多少、变化有多快。状态从初值向终值平滑靠近，不一定从零开始。","conceptFlow":["找初值","找终值","找时间常数"],"exampleDiagram":null,"referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/10-5-rc-circuits","tinyExample":"例如初始 4 V，最终 10 V，经过一个时间常数后，剩余差约为 (10−4)×36.8%=2.208 V，因此电压约为 7.79 V。"},{"title":"RC：找初值、终值和电阻","body":"\u003cp>RC电路的时间常数τ=R等效C。求R等效时，要从电容端看进去，在正确保留受控源关系的前提下处理供电网络。先用简单电阻网络练习。\u003c/p>\u003cp>例如12 V通过2 kΩ给100 μF未充电电容充电：τ=0.2 s，初值0、终值12 V，所以uC=12(1−e^(−t/0.2))。t=τ时达到终值变化量的约63.2%。\u003c/p>\u003cdiv class=\"equation\">τ\u003csub>RC\u003c/sub> = R\u003csub>等效\u003c/sub>C\u003c/div>","q":{"id":"c10-2","type":"number","prompt":"R=2 kΩ，C=100 μF，时间常数是多少？","value":0.2,"unit":"s","explain":"2000×100×10⁻⁶=0.2 s。","hints":["kΩ与μF的前缀都要换算。"],"tag":"时间常数"},"diagram":"rc","widget":"rc","intuition":"RC 电路中的时间常数等于从电容端看进去的等效电阻乘电容。电阻或电容更大，通常意味着这一理想过程变化更慢。","conceptFlow":["电容电压作状态","求端口等效电阻","计算时间常数RC"],"exampleDiagram":null,"referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/10-5-rc-circuits","tinyExample":"例如 2 kΩ 与 100 μF 相乘：2000 Ω×0.0001 F=0.2 s。经过 0.2 s，电容电压完成初值到终值差值的约 63.2%。"},{"title":"电压趋近时，电流怎样变化","body":"\u003cp>电阻电流可由i=(Us−uC)/R求。未充电电容刚接入时，电流为Us/R；随着电容电压上升，电阻压降减小，电流逐渐接近0。理想直流电源仍维持电压，但稳态电容支路没有持续充电电流。\u003c/p>\u003cp>对12 V、2 kΩ、100 μF例子，i(0⁺)=6 mA；t=τ时i=6/e≈2.207 mA。若改变R，时间常数与初始电流都可能变；改变C时，理想最终电压仍由电路决定。\u003c/p>","q":{"id":"c10-3","type":"number","prompt":"12 V通过2 kΩ给未充电电容充电，初始电流是多少？","value":6,"unit":"mA","explain":"i(0⁺)=12/2000=0.006 A=6 mA。","hints":[],"tag":"初始电流"},"diagram":null,"widget":null,"intuition":"充电时，电容电压逐渐升高，电阻两端电压逐渐减小，因此串联电流也逐渐减小。稳定后理想电容支路电流为零。","conceptFlow":["电容电压升高","电阻压降减小","充电电流减小"],"exampleDiagram":"rc","referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/10-5-rc-circuits"},{"title":"RL用同样的三要素思路","body":"\u003cp>串联RL的状态通常选电感电流，τ=L/R等效。5 V经10 Ω给100 mH电感供电，初始电流0、终值0.5 A、τ=0.01 s。\u003c/p>\u003cdiv class=\"equation\">i\u003csub>L\u003c/sub>(t)=0.5(1−e\u003csup>−t/0.01\u003c/sup>) A；τ\u003csub>RL\u003c/sub>=\u003cspan class=\"fraction\" aria-label=\"分数\">\u003cspan>L\u003c/span>\u003cspan>R\u003csub>等效\u003c/sub>\u003c/span>\u003c/span>\u003c/div>\u003cp>电流初期变化快，电感电压较大；之后电流变化变慢，电感压降趋零。把电感当作一直开路或一直短路，都漏掉了变化过程。\u003c/p>","q":{"id":"c10-4","type":"number","prompt":"L=100 mH、R=10 Ω，RL时间常数是多少？","value":10,"unit":"ms","explain":"0.1/10=0.01 s=10 ms。","hints":[],"tag":"时间常数"},"diagram":null,"widget":null,"intuition":"RL 电路也先找初值、终值、时间常数；这次常选电感电流为状态，时间常数是电感除以电感端看到的等效电阻。","conceptFlow":["电感电流作状态","求初值与终值","计算时间常数L/R"],"exampleDiagram":"inductorDC","referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/10-5-rc-circuits"},{"title":"用几个时间点读波形","body":"\u003cp>距离终值的误差按e^(−t/τ)缩小：1τ剩36.8%，3τ剩约5%，5τ剩约0.674%。所谓“5τ基本结束”是工程近似，数学上指数并未突然变零。\u003c/p>\u003cp>对任意初值，缩小的是“初值与终值之差”。如果初值4 V、终值10 V，t=τ时不能直接算10×63.2%，应算10+(4−10)/e。\u003c/p>","q":{"id":"c10-5","type":"choice","prompt":"初值4 V、终值10 V，t=τ时应使用？","options":["10+(4−10)/e","10×63.2%","4+10"],"answer":0,"explain":"指数衰减的是状态与终值之间的差。","hints":[],"tag":"非零初值"},"diagram":null,"widget":null,"intuition":"经过一个时间常数后，离终值的差距约剩原来的 36.8%。这是针对初值和终值之间的差，不是任何时候都直接乘最终电压。","conceptFlow":["找初值与终值之差","按时间常数缩小差距","加回终值"],"exampleDiagram":null,"referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/10-5-rc-circuits"}],"finale":{"intro":"电容原本为4 V。在t=0通过1 kΩ接到10 V理想直流源，C=200 μF。换路后只有这个一阶充电回路，电压电流有限。","diagram":"rcInitial","parts":[{"id":"c10-f1","type":"number","prompt":"换路瞬间uC(0⁺)","value":4,"unit":"V","explain":"电容电压连续，仍为4 V。","hints":[],"tag":"计算与单位"},{"id":"c10-f2","type":"number","prompt":"时间常数τ","value":0.2,"unit":"s","explain":"1000×200×10⁻⁶=0.2 s。","hints":[],"tag":"计算与单位"},{"id":"c10-f3","type":"number","prompt":"最终电压uC(∞)","value":10,"unit":"V","explain":"稳态电流为0，电阻无压降，电容为10 V。","hints":[],"tag":"计算与单位"},{"id":"c10-f4","type":"number","prompt":"t=0.2 s时电容电压","value":7.792723352971346,"unit":"V","explain":"uC=10−6/e≈7.793 V。","hints":["用初值4、终值10，不能按零初值处理。"],"tag":"非零初值"},{"id":"c10-f5","type":"number","prompt":"换路瞬间电流","value":6,"unit":"mA","explain":"(10−4)/1000=6 mA。","hints":[],"tag":"计算与单位"}],"solution":["三要素：uC(0⁺)=4 V，uC(∞)=10 V，τ=0.2 s。","uC(t)=10−6e^(−t/0.2) V。电流i(t)=6e^(−t/0.2) mA。","t=0.2 s时uC≈7.793 V、i≈2.207 mA。t=0和t趋大分别回到4 V和10 V。","若只把R加倍，则τ加倍、初始电流减半，初值与终值在此理想电路中不变。"],"takeaways":["先求三要素，再写通用式。","用t=0、t趋大、单位和曲线趋势一起检查。"]}},{"id":"14","title":"正弦量、有效值与相量","group":"交流与三相","minutes":"55–75","prior":"计划待学","prereq":"三角函数、周期、复数的初步认识；本讲会补必要部分。","goals":["区分瞬时值、峰值和有效值","根据同频正弦量比较相位","把正弦稳态量转换成统一约定的相量"],"guides":["电压表读到的数值和正弦波峰值是什么关系？","两个电流峰值出现时间不同，怎样描述？","为什么交流问题可以转换成复数运算？"],"sections":[{"title":"用三个参数描述正弦波","body":"\u003cp>本学习包统一用余弦表示：u(t)=Um cos(ωt+φ)。Um为峰值，ω为角频率，φ为初相。周期T是重复一次的时间，频率f是每秒重复次数。\u003c/p>\u003cdiv class=\"equation\">T=1/f；ω=2πf\u003c/div>\u003cp>例如u=12√2 cos(100πt+30°) V，角频率100π rad/s，频率50 Hz，周期0.02 s。计算相位时，角度与弧度不能混用：30°=π/6 rad。\u003c/p>","q":{"id":"c14-1","type":"number","prompt":"ω=100π rad/s时，频率是多少？","value":50,"unit":"Hz","explain":"f=ω/(2π)=50 Hz。","hints":[],"tag":"频率与周期"},"diagram":null,"widget":null,"intuition":"看正弦波先认三个量：峰值有多高、多久重复一次、从什么相位开始。频率越高，单位时间内重复次数越多。","conceptFlow":["看峰值","看周期与频率","看初始相位"],"exampleDiagram":"acSeries","referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/15-2-simple-ac-circuits"},{"title":"有效值描述等效发热能力","body":"\u003cp>有效值是平方的时间平均再开方，它使电阻上的平均发热与相应直流一致。纯正弦量U=Um/√2、I=Im/√2，这个√2关系不能随便套到任意波形。\u003c/p>\u003cp>上例峰值12√2 V、有效值12 V。交流电阻功率用有效值P=UI或I²R；如果把峰值直接当有效值，功率会算错一倍。\u003c/p>\u003cdiv class=\"equation\">正弦波：U=\u003cspan class=\"fraction\" aria-label=\"分数\">\u003cspan>U\u003csub>m\u003c/sub>\u003c/span>\u003cspan>√2\u003c/span>\u003c/span>\u003c/div>","q":{"id":"c14-2","type":"number","prompt":"正弦电压峰值为12√2 V，有效值是多少？","value":12,"unit":"V","explain":"正弦有效值=峰值/√2=12 V。","hints":[],"tag":"有效值"},"diagram":null,"widget":null,"intuition":"有效值用等效发热来理解：把同一电阻接到有效值相同的直流电压上，平均发热相同。峰值除以根号二只适用于正弦波。","conceptFlow":["看比较的同一电阻","比较平均发热","正弦波才用√2关系"],"exampleDiagram":"acSeries","referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/15-2-simple-ac-circuits","tinyExample":"正弦电压峰值是 12√2 V 时，有效值是 12 V；有效值表示对同一电阻产生同样平均热效应的直流电压大小。"},{"title":"相位只比较相同频率的量","body":"\u003cp>u=Um cos(ωt+φu)、i=Im cos(ωt+φi)，定义φ=φu−φi。φ&gt;0时电压相位超前电流，常说电流滞后。这里以相同的余弦参考和相同频率比较。\u003c/p>\u003cp>例如电压初相30°、电流初相−10°，相位差为40°。不要只比较某个瞬间谁的数值大；幅值也会影响瞬时值。正弦转余弦时，sinθ=cos(θ−90°)。\u003c/p>","q":{"id":"c14-3","type":"number","prompt":"电压初相30°、电流初相−10°，φu−φi是多少？","value":40,"unit":"deg","explain":"30−(−10)=40°。","hints":[],"tag":"相位差"},"diagram":null,"widget":"phase","intuition":"相位比较的是同频波形的先后：选同一种参考波形，再看相位角相差多少。相位领先不等于某个瞬间的数值一定更大。","conceptFlow":["确认频率相同","统一正弦余弦参考","比较相位角"],"exampleDiagram":null,"referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/15-2-simple-ac-circuits"},{"title":"相量保留幅值和初相","body":"\u003cp>对同频正弦稳态，公共时间因子可以暂时省去，用复数相量保存有效值和初相。本包写U̲=U∠φ，用有效值，不用峰值。直角形式为Ucosφ+jUsinφ，其中j²=−1。\u003c/p>\u003cp>例如3∠0°+4∠90°=3+j4=5∠53.13°。不能把两个有效值3和4直接加成7，因为它们的时间相位不同。瞬时值不是相量本身，最终需要时再还原波形。\u003c/p>\u003cdiv class=\"equation\">U̲ = U∠φ = U(cosφ + j sinφ)\u003c/div>","q":{"id":"c14-4","type":"number","prompt":"相量3∠0°与4∠90°相加，合相量的有效值是多少？","value":5,"unit":"V","explain":"|3+j4|=√(3²+4²)=5。","hints":["先转成实部和虚部相加。"],"tag":"相量相加"},"diagram":null,"widget":null,"intuition":"相量把同频正弦量的有效值和初相放在一个复数里，方便运算；它不是某一瞬间的电压。求完后仍要把结果解释回原波形。","conceptFlow":["统一频率与参考","写有效值和初相","运算后解释波形"],"exampleDiagram":null,"referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/15-2-simple-ac-circuits"}],"finale":{"intro":"已知u(t)=24√2 cos(200πt−30°) V，i(t)=2√2 cos(200πt−60°) A。两者使用相同的余弦参考，t的单位为秒。","diagram":null,"parts":[{"id":"c14-f1","type":"number","prompt":"电压有效值","value":24,"unit":"V","explain":"峰值24√2除以√2为24 V。","hints":[],"tag":"计算与单位"},{"id":"c14-f2","type":"number","prompt":"电流有效值","value":2,"unit":"A","explain":"峰值2√2除以√2为2 A。","hints":[],"tag":"计算与单位"},{"id":"c14-f3","type":"number","prompt":"频率","value":100,"unit":"Hz","explain":"200π/(2π)=100 Hz。","hints":[],"tag":"计算与单位"},{"id":"c14-f4","type":"number","prompt":"周期","value":10,"unit":"ms","explain":"1/100 s=0.01 s=10 ms。","hints":[],"tag":"计算与单位"},{"id":"c14-f5","type":"number","prompt":"φu−φi","value":30,"unit":"deg","explain":"−30−(−60)=30°，电压超前、电流滞后。","hints":[],"tag":"计算与单位"}],"solution":["有效值U=24 V、I=2 A；ω=200π rad/s，f=100 Hz，T=10 ms。","有效值相量U̲=24∠−30° V，I̲=2∠−60° A。","相位差为30°，表示电流相对电压滞后30°；它不是说电流大小一定比电压“小30”。"],"takeaways":["先统一余弦和有效值约定，再比较相位。","相量不是把瞬时电压电流变成普通实数。"]}},{"id":"15","title":"阻抗与相量法","group":"交流与三相","minutes":"60–80","prior":"计划待学","prereq":"正弦稳态、有效值相量、复数加减与极坐标。","goals":["把R/L/C关系写成阻抗","用相量欧姆定律计算","用相位和幅值检查电路行为"],"guides":["电感、电容为什么既影响电流大小也影响相位？","交流回路各电压有效值能直接相加吗？","频率变化时，哪些元件的阻抗会改变？"],"sections":[{"title":"阻抗把元件规律放进复数关系","body":"\u003cp>在同频正弦稳态中，采用关联参考方向，有U̲=ZI̲。电阻ZR=R；电感ZL=jωL；电容ZC=1/(jωC)=−j/(ωC)。阻抗单位仍是Ω，j表示90°的相位关系。\u003c/p>\u003cdiv class=\"equation\">Z\u003csub>R\u003c/sub>=R；Z\u003csub>L\u003c/sub>=jωL；Z\u003csub>C\u003c/sub>=−j/(ωC)\u003c/div>\u003cp>电感上电压超前电流90°，电容上电流超前电压90°。这些关系用于理想元件、正弦稳态；刚换路的暂态不能直接用一个定频阻抗取代全部分析。\u003c/p>","q":{"id":"c15-1","type":"choice","prompt":"理想电容的阻抗在本包相量约定下为？","options":["−j/(ωC)","jωC","R"],"answer":0,"explain":"1/j=−j，所以电容阻抗为负虚数。","hints":[],"tag":"阻抗符号"},"diagram":null,"widget":null,"intuition":"阻抗把元件对正弦电流的幅值和相位影响一起表示出来。电阻、电感、电容的阻抗形式不同，但单位都用欧姆。","conceptFlow":["确定正弦稳态频率","写各元件阻抗","保留复数相位"],"exampleDiagram":null,"referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/15-2-simple-ac-circuits"},{"title":"串联先加阻抗，再求电流","body":"\u003cp>串联RLC的阻抗Z=R+j(XL−XC)，其中XL=ωL、XC=1/(ωC)都先取正的数值。正虚部表示整体感性，负虚部表示整体容性。\u003c/p>\u003cdiv class=\"equation\">|Z|=√[R²+(X\u003csub>L\u003c/sub>−X\u003csub>C\u003c/sub>)²]\u003c/div>\u003cp>例如R=6 Ω、XL=8 Ω、无电容，Z=6+j8=10∠53.13° Ω。20∠0° V加在其上，I̲=2∠−53.13° A。电流滞后，与感性判断一致。\u003c/p>","q":{"id":"c15-2","type":"number","prompt":"Z=6+j8 Ω，阻抗模是多少？","value":10,"unit":"Ω","explain":"√(6²+8²)=10 Ω。","hints":[],"tag":"复数模"},"diagram":"acSeries","widget":null,"intuition":"串联电路各元件电流相同，因此先把复数阻抗相加，再用相量形式的欧姆定律求电流。虚部的正负用于判断整体感性或容性。","conceptFlow":["逐项写复数阻抗","求总阻抗","电压相量除以阻抗"],"exampleDiagram":null,"referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/15-2-simple-ac-circuits","tinyExample":"电阻 6 Ω 与感抗 8 Ω 串联，阻抗为 6+j8 Ω，大小是 10 Ω。加 20 V 有效值的正弦电压，电流有效值为 2 A。"},{"title":"KCL/KVL仍成立，但量是相量","body":"\u003cp>上例电流有效值2 A，电阻电压UR=12 V、电感电压UL=16 V；它们相位相差90°，源电压模为√(12²+16²)=20 V，而不是28 V。\u003c/p>\u003cp>串联阻抗相加，并联则可加导纳Y=1/Z。节点法和网孔法的结构仍能用，只是电压、电流与系数换成复数。求出复数电流后，再解释大小和方向关系。\u003c/p>","q":{"id":"c15-3","type":"number","prompt":"串联RL的UR=12 V、UL=16 V，正交相位下源电压有效值是多少？","value":20,"unit":"V","explain":"相量相加：√(12²+16²)=20 V。","hints":["电阻与理想电感电压相差90°。"],"tag":"交流电压相加"},"diagram":null,"widget":null,"intuition":"电荷守恒和回路电位关系仍然成立，只是交流稳态中求解用的是相量。不能把相位不同的电压幅值直接当普通数字相加。","conceptFlow":["画出相量参考方向","用相量列KCL或KVL","按复数计算"],"exampleDiagram":"acSeries","referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/15-2-simple-ac-circuits"},{"title":"频率改变会改变阻抗","body":"\u003cp>理想电感电抗XL与频率成正比；理想电容电抗XC与频率成反比。相同RLC在不同频率下，电流大小和相位可能不同。\u003c/p>\u003cp>先做三个检查：Ω与A相乘应得到V；整体感性时电流应滞后；串联时电流相同，电压按相量相加。高频下实际元件寄生参数可能使理想模型失效，后续项目需另核对。\u003c/p>","q":{"id":"c15-4","type":"choice","prompt":"理想电容C不变，频率加倍时其电抗大小怎样变化？","options":["减半","加倍","不变"],"answer":0,"explain":"XC=1/(2πfC)，f加倍则XC减半。","hints":[],"tag":"频率与电抗"},"diagram":null,"widget":null,"intuition":"理想电感的电抗随频率增加而增大；理想电容的电抗随频率增加而减小。比较前要确认其余元件参数保持不变。","conceptFlow":["改变频率","分别看感抗和容抗","判断总阻抗变化"],"exampleDiagram":null,"referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/15-2-simple-ac-circuits"}],"finale":{"intro":"某串联RLC电路在给定频率下R=8 Ω、XL=10 Ω、XC=4 Ω。源电压有效值24 V，选源相量24∠0° V。","diagram":"rlc","parts":[{"id":"c15-f1","type":"number","prompt":"阻抗虚部对应的净电抗XL−XC","value":6,"unit":"Ω","explain":"10−4=6 Ω，整体感性。","hints":[],"tag":"计算与单位"},{"id":"c15-f2","type":"number","prompt":"阻抗模|Z|","value":10,"unit":"Ω","explain":"Z=8+j6，模√(64+36)=10 Ω。","hints":[],"tag":"计算与单位"},{"id":"c15-f3","type":"number","prompt":"电流有效值I","value":2.4,"unit":"A","explain":"24/10=2.4 A。","hints":[],"tag":"计算与单位"},{"id":"c15-f4","type":"number","prompt":"源电压相位减电流相位φ","value":36.86989764584402,"unit":"deg","explain":"φ=atan(6/8)=36.87°，电流滞后。","hints":["先从Z的实部、虚部确定阻抗角。"],"tag":"相位差"}],"solution":["Z=8+j(10−4)=8+j6=10∠36.87° Ω。","I̲=24∠0°/(10∠36.87°)=2.4∠−36.87° A。","UR=19.2 V、UL=24 V、UC=9.6 V。净无功方向电压14.4 V，源电压模√(19.2²+14.4²)=24 V。","不能把19.2+24+9.6当作源电压。整体感性，电流滞后36.87°，与判断相符。"],"takeaways":["交流方程保留守恒关系，但运算要遵守复数规则。","有效值的大小通常不能代替相量直接相加。"]}},{"id":"16","title":"交流功率与功率因数","group":"交流与三相","minutes":"55–75","prior":"计划待学","prereq":"有效值、阻抗、相位差及直流功率。","goals":["区分有功、无功和视在功率","根据负载相位判断Q的符号","解释功率因数补偿能改变什么"],"guides":["电压电流都很大，为什么有功功率可能不大？","无功功率是不是表示电能被白白消耗成热？","并联电容补偿后，负载本身的工作功率一定改变吗？"],"sections":[{"title":"瞬时功率有平均值，也有来回交换","body":"\u003cp>瞬时功率p(t)=u(t)i(t)。正弦稳态下，其一个周期的平均值是有功功率P=UIcosφ，U、I用有效值，φ=φu−φi。有功反映平均净能量转移，例如电阻发热。\u003c/p>\u003cp>电感和电容会在某些时段吸收能量、另一些时段返回能量，所以瞬时功率可能变号。理想纯电抗平均有功为零，但电流不一定为零，输电导线仍可能因该电流发热。\u003c/p>\u003cdiv class=\"equation\">P=UIcosφ　单位W\u003c/div>","q":{"id":"c16-1","type":"number","prompt":"U=20 V，I=2 A，cosφ=0.6，有功功率是多少？","value":24,"unit":"W","explain":"20×2×0.6=24 W。","hints":["U、I用有效值。"],"tag":"有功功率"},"diagram":null,"widget":null,"intuition":"瞬时功率是每一瞬间的电压乘电流；有功功率是一个周期的平均值。电感和电容可以暂存能量再送回，所以瞬时功率可能改变正负。","conceptFlow":["逐瞬间看电压电流","相乘得到瞬时功率","一个周期取平均"],"exampleDiagram":null,"referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/15-4-power-in-an-ac-circuit"},{"title":"用P、Q、S描述不同侧面","body":"\u003cp>无功功率Q=UIsinφ，单位var；感性电流滞后时Q&gt;0，容性电流超前时Q&lt;0。视在功率S=UI，单位VA。正弦单相中S²=P²+Q²。\u003c/p>\u003cdiv class=\"equation\">Q=UIsinφ；S=UI；S²=P²+Q²\u003c/div>\u003cp>例如20 V、2 A、cosφ=0.6且滞后，sinφ=0.8，因此P=24 W、Q=32 var、S=40 VA。P与Q不是同一种单位，不能当普通实数直接相加为S。\u003c/p>","q":{"id":"c16-2","type":"number","prompt":"上述例子的视在功率是多少？","value":40,"unit":"VA","explain":"S=20×2=40 VA。","hints":[],"tag":"视在功率"},"diagram":null,"widget":null,"intuition":"P 表示平均有功能量传递，Q 描述正弦条件下的无功交换，S 与有效电压、电流的乘积有关。它们分别用 W、var、VA。","conceptFlow":["先找有效电压电流","根据相位求P与Q","区分单位与S"],"exampleDiagram":"acSeries","referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/15-4-power-in-an-ac-circuit"},{"title":"功率因数关系到电源和线路负担","body":"\u003cp>正弦情况下功率因数PF=P/S=cosφ。同样P、同样供电电压下，PF偏低意味着电源电流更大，线路I²R损耗、导线容量和电源容量需求可能增加。\u003c/p>\u003cp>例如100 V供电、P=400 W、PF=0.8，电源电流为400/(100×0.8)=5 A。若改善到PF=1且负载有功保持不变，电源电流为4 A。存在谐波时总功率因数不一定等于简单的cosφ，本讲先限定正弦。\u003c/p>","q":{"id":"c16-3","type":"number","prompt":"100 V、400 W、PF=0.8，电源电流是多少？","value":5,"unit":"A","explain":"I=P/(U·PF)=400/80=5 A。","hints":[],"tag":"功率因数"},"diagram":null,"widget":null,"intuition":"同样的有功功率和电源电压下，功率因数较低意味着源侧电流较大，导线的电阻发热可能增加。这里先讨论正弦条件。","conceptFlow":["固定有功功率和电压","比较源侧电流","考虑线路发热"],"exampleDiagram":null,"referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/15-4-power-in-an-ac-circuit"},{"title":"并联补偿改变源侧无功需求","body":"\u003cp>在电压、频率近似恒定的理想正弦模型中，并联电容提供容性无功，可以抵消感性负载向电源索取的部分无功。原负载支路的电压和有功需求可基本不变，变化主要体现在源侧电流与无功。\u003c/p>\u003cdiv class=\"equation\">|Q\u003csub>C\u003c/sub>|=ωCU²；C=\u003cspan class=\"fraction\" aria-label=\"分数\">\u003cspan>|Q\u003csub>C\u003c/sub>|\u003c/span>\u003cspan>ωU²\u003c/span>\u003c/span>\u003c/div>\u003cp>补偿目标与实际设备约束需要具体设计，不能认为电容越多越好。本课程只做计算或仿真，不指导带电接入实际补偿装置。\u003c/p>","q":{"id":"c16-4","type":"choice","prompt":"理想条件下并联补偿后，首先应比较哪个电流来判断线路负担？","options":["电源总电流","只看原负载支路电流","只看电容电流"],"answer":0,"explain":"源电流是负载与电容电流的相量和。补偿主要降低源侧无功需求。","hints":[],"tag":"补偿边界"},"diagram":null,"widget":null,"intuition":"感性负载并联合适电容后，电容可提供一部分容性无功，减少电源侧需要提供的无功；应结合目标值计算，不能无限增大电容。","conceptFlow":["识别原负载无功","计算需要补偿多少","检查电源侧结果"],"exampleDiagram":null,"referenceUrl":"https://openstax.org/books/university-physics-volume-2/pages/15-4-power-in-an-ac-circuit"}],"finale":{"intro":"单相正弦电源有效值100 V、50 Hz，某感性负载电流有效值5 A、功率因数0.8滞后。计算功率；再在理想模型中并联电容，使源侧功率因数达到1，假设负载有功不变。仅做纸笔或仿真。","diagram":null,"parts":[{"id":"c16-f1","type":"number","prompt":"视在功率S","value":500,"unit":"VA","explain":"100×5=500 VA。","hints":[],"tag":"计算与单位"},{"id":"c16-f2","type":"number","prompt":"有功功率P","value":400,"unit":"W","explain":"500×0.8=400 W。","hints":[],"tag":"计算与单位"},{"id":"c16-f3","type":"number","prompt":"负载无功功率Q","value":300,"unit":"var","explain":"sinφ=0.6，Q=500×0.6=300 var。","hints":["滞后负载Q取正。"],"tag":"无功符号"},{"id":"c16-f4","type":"number","prompt":"完全补偿后源侧电流","value":4,"unit":"A","explain":"源侧PF=1，I=P/U=400/100=4 A。","hints":[],"tag":"计算与单位"},{"id":"c16-f5","type":"number","prompt":"所需电容无功功率Q_C，保留符号","value":-300,"unit":"var","explain":"Qc=−300 var，用容性无功抵消原+300 var。","hints":[],"tag":"无功符号"},{"id":"c16-f6","type":"number","prompt":"电容C（理想计算）","value":95.49296585513719,"unit":"μF","explain":"C=300/(2π×50×100²)≈95.49 μF。","hints":["|Qc|=ωCU²，电压用有效值。"],"tag":"计算与单位"}],"solution":["S=500 VA，P=400 W，Q=+300 var，验证400²+300²=500²。","理想补偿到1需要Qc=−300 var，源侧Q为0，P仍400 W，源电流4 A。","C≈95.49 μF，电容支路电流大小3 A，与原负载电流作相量抵消。","负载本身仍可流过原5 A。实际补偿需要考虑谐波、投切、额定值和保护，不能把纸笔结果直接当施工方案。"],"takeaways":["P、Q、S分别对应W、var、VA。","补偿先明确假设和比较位置，不把源电流与负载支路电流混为一谈。"]}},{"id":"20","title":"对称三相电路","group":"交流与三相","minutes":"65–85","prior":"计划待学","prereq":"正弦量、相量、阻抗、单相交流功率。","goals":["在图上分清线量和相量","分析平衡星形与三角形负载","计算三相总功率并联系电机绕组电压"],"guides":["三相为什么相差120°而不是同时达到峰值？","星形和三角形中，每相负载承受的电压相同吗？","线电流与相电流什么时候相等、什么时候相差√3？"],"sections":[{"title":"先明确平衡与相序","body":"\u003cp>平衡三相电源的三相正弦电压，幅值相同、频率相同、相位依次相差120°。正相序ABC可写成Ua=U∠0°、Ub=U∠−120°、Uc=U∠120°。\u003c/p>\u003cp>若三相负载阻抗也相同，称对称负载。可以先分析一相，再利用相位关系得到另外两相。零线电流为零的结论要求相应的平衡条件；不能推广到任意不平衡或含谐波场景。\u003c/p>","q":{"id":"c20-1","type":"number","prompt":"平衡三相相邻相电压的相位差大小是多少？","value":120,"unit":"deg","explain":"三个相位在一周360°内均匀分布，每相差120°。","hints":[],"tag":"三相相位"},"diagram":null,"widget":null,"intuition":"平衡三相先看三个条件：幅值相同、频率相同、相位相差 120°。相序描述三相按时间先后出现的次序。","conceptFlow":["核对幅值","核对频率","确认相差120°及相序"],"exampleDiagram":null,"referenceUrl":"https://ocw.mit.edu/courses/6-002-circuits-and-electronics-spring-2007/"},{"title":"星形：每相接在线与中性点之间","body":"\u003cp>星形Y负载的三相一端连接为共同点n，另一端接A、B、C。每相电压是线到中性点电压，线电压是两条线之间电压。\u003c/p>\u003cdiv class=\"equation\">平衡Y：U\u003csub>线\u003c/sub>=√3 U\u003csub>相\u003c/sub>；I\u003csub>线\u003c/sub>=I\u003csub>相\u003c/sub>\u003c/div>\u003cp>因为Uab=Ua−Ub，两个相差120°的相量之差的模为√3U。正相序与相应方向下，Uab还比Ua超前30°。用线电压直接除相阻抗，会把星形电流多算√3。\u003c/p>","q":{"id":"c20-2","type":"number","prompt":"平衡星形负载线电压为120√3 V，每相电压是多少？","value":120,"unit":"V","explain":"U相=U线/√3=120 V。","hints":[],"tag":"线量与相量"},"diagram":"starDelta","widget":null,"intuition":"星形连接中三相各有一端汇到中性点。相电压是线与中性点之间，线电压是两条线之间；平衡条件下两者大小相差√3。","conceptFlow":["找到公共中性点","区分线电压和相电压","使用平衡Y关系"],"exampleDiagram":null,"referenceUrl":"https://ocw.mit.edu/courses/6-002-circuits-and-electronics-spring-2007/","tinyExample":"平衡星形负载中，若线电压为 380 V，则相电压约 380/√3≈219 V。该计算是理想电路示例，不是带电接线指导。"},{"title":"三角形：每相直接跨两条线","body":"\u003cp>三角形Δ中，每相负载直接接在AB、BC、CA之间，因此U相=U线。线电流是该节点相邻两相支路电流的相量差，而非其中某一相电流。\u003c/p>\u003cdiv class=\"equation\">平衡Δ：U\u003csub>线\u003c/sub>=U\u003csub>相\u003c/sub>；I\u003csub>线\u003c/sub>=√3 I\u003csub>相\u003c/sub>\u003c/div>\u003cp>看到√3先问它连接的是哪两个量，不要把星形电压关系与三角形电流关系对调。相位30°关系也要配合相序和电流参考方向使用。\u003c/p>","q":{"id":"c20-3","type":"number","prompt":"平衡三角形负载每相电流2 A，线电流大小是多少？","value":3.4641016151377544,"unit":"A","explain":"I线=√3×2≈3.464 A。","hints":["三角形线电流是两相支路电流的相量差。"],"tag":"线量与相量"},"diagram":null,"widget":null,"intuition":"三角形连接中每一相直接跨接两条线，因此相电压等于线电压；线电流是相关相电流的相量差。","conceptFlow":["找到三角形三条边","每相跨两条线","按相量求线电流"],"exampleDiagram":"starDelta","referenceUrl":"https://ocw.mit.edu/courses/6-002-circuits-and-electronics-spring-2007/"},{"title":"三相功率是三个相功率之和","body":"\u003cp>平衡正弦三相负载总功率P=3U相I相cosφ=√3U线I线cosφ。类似地，Q=√3U线I线sinφ、S=√3U线I线。\u003c/p>\u003cdiv class=\"equation\">P\u003csub>三相\u003c/sub>=√3 U\u003csub>线\u003c/sub>I\u003csub>线\u003c/sub>cosφ\u003c/div>\u003cp>φ是每相负载电压与该相电流之差，也就是负载阻抗角。用线电压和线电流对应波形直接相减时，还可能混入连接关系的30°，不能不加判断地拿来当φ。\u003c/p>","q":{"id":"c20-4","type":"number","prompt":"平衡Y负载每相120 V、8 A、cosφ=0.8，总有功功率是多少？","value":2304,"unit":"W","explain":"3×120×8×0.8=2304 W。","hints":[],"tag":"三相功率"},"diagram":null,"widget":null,"intuition":"三相总功率先理解成三个相功率的和。只有在对应平衡正弦条件下，才能方便地改写为线电压、线电流形式。","conceptFlow":["先算每相功率","三个相功率求和","平衡时换用线量公式"],"exampleDiagram":null,"referenceUrl":"https://ocw.mit.edu/courses/6-002-circuits-and-electronics-spring-2007/"},{"title":"绕组接法要满足额定电压","body":"\u003cp>同一线电压下，星形每相绕组承受U线/√3，三角形承受U线。把相同阻抗从Y改Δ，在同一电源和理想条件下，线电流及总功率会改变。\u003c/p>\u003cp>因此，电机不能仅凭“想功率更大”就随意改变接法，要根据铭牌、绕组额定电压、启动和保护要求判断。星三角启动还涉及互锁、切换和实际负载条件，后续电机与电气控制课程再详细学习。\u003c/p>","q":{"id":"c20-5","type":"choice","prompt":"同一线电压下，把相同绕组由Y改为Δ，每相绕组电压会怎样？","options":["变为原来的√3倍","变为原来的1/√3","不变"],"answer":0,"explain":"Y中U相=U线/√3，Δ中U相=U线。实际接法必须符合额定条件。","hints":[],"tag":"绕组电压"},"diagram":null,"widget":null,"intuition":"同一线电压下，星形和三角形绕组承受的每相电压不同。实际电机接法必须看铭牌和绕组额定电压，不能凭想象更改。","conceptFlow":["读取电机铭牌","比较绕组相电压","在专业指导下选接法"],"exampleDiagram":"starDelta","referenceUrl":"https://ocw.mit.edu/courses/6-002-circuits-and-electronics-spring-2007/"}],"finale":{"intro":"平衡正相序三相电源，线电压有效值U线=120√3 V。每相负载阻抗Z=12+j9 Ω，接成星形，按理想对称正弦电路分析。","diagram":"star","parts":[{"id":"c20-f1","type":"number","prompt":"每相电压有效值","value":120,"unit":"V","explain":"星形U相=U线/√3=120 V。","hints":[],"tag":"计算与单位"},{"id":"c20-f2","type":"number","prompt":"每相阻抗模","value":15,"unit":"Ω","explain":"√(12²+9²)=15 Ω。","hints":[],"tag":"计算与单位"},{"id":"c20-f3","type":"number","prompt":"线电流有效值","value":8,"unit":"A","explain":"I相=120/15=8 A，Y中I线=I相。","hints":[],"tag":"计算与单位"},{"id":"c20-f4","type":"number","prompt":"功率因数","value":0.8,"unit":"1","explain":"cosφ=R/|Z|=12/15=0.8，整体感性滞后。","hints":[],"tag":"计算与单位"},{"id":"c20-f5","type":"number","prompt":"三相总有功功率","value":2304,"unit":"W","explain":"3×120×8×0.8=2304 W。","hints":[],"tag":"计算与单位"},{"id":"c20-f6","type":"number","prompt":"三相总无功功率","value":1728,"unit":"var","explain":"sinφ=9/15=0.6，Q=3×120×8×0.6=1728 var。","hints":[],"tag":"计算与单位"}],"solution":["星形每相120 V；Z=15∠36.87° Ω，每相电流8 A并滞后相电压36.87°。","I线=8 A；三相S=3×120×8=2880 VA；P=2304 W，Q=1728 var。","验证P²+Q²=S²，平衡下三相电流相量和为0。","如果相同阻抗在相同线电压下改接Δ，U相变为120√3 V、I相=8√3 A、I线=24 A、P=6912 W。这只是理想对比，不能据此随意改接真实电机。"],"takeaways":["先看接法，再分清所给与所求的线量、相量。","三相总功率可用三倍相功率核对√3线量公式。"]}},{"id":"m1","number":"1","subject":"machines","group":"第1章 · 磁路与磁材料","title":"认识磁路","minutes":"45–65","prior":"开始学习","prereq":"知道电流与线圈的含义，能用欧姆定律分析简单串联电路。面积和长度换算将在例题里复习。","use":"变压器靠铁芯引导磁通，旋转电机的主磁通要跨过定转子气隙。先学会用一条等效磁路估算磁通，后面才能理解绕组感应电压和电机气隙的作用。","source":"Stephen D. Umans，《Fitzgerald & Kingsley’s Electric Machinery》第 7 版，第 1 章 §1.1，印刷页 2–8。讲解、图示和练习为本课程自主编写。","goals":["说清线圈电流和高磁导率铁芯各起什么作用","区分磁动势 ℱ、磁通 Φ、磁通密度 B 与磁阻 ℛ","用单路径磁路估算气隙对磁通的影响，并说明近似条件"],"guides":["线圈通电和放入铁芯分别改变了什么？","如果同样多的磁通穿过一个更窄的截面，磁通密度怎么变？","为什么一个很短的空气间隙也可能比整段铁芯的磁阻大？"],"sections":[{"title":"线圈怎样建立磁场，铁芯怎样引导磁通","intuition":"想象一根导线绕在闭合铁芯上。导线中有电流，周围就会出现磁场。每匝线圈都参与建立磁场。高磁导率的铁芯让大部分磁通沿着铁芯所形成的闭合路径分布。","conceptFlow":["给线圈通电","线圈电流建立磁场","铁芯引导主要磁通"],"diagram":"motorCore","referenceText":"教材 §1.1，印刷页 2–3，图 1.1。","body":"\u003cp>线圈中的电流沿着导线流动。图里的磁通箭头画在铁芯里，表示磁场的路径。两条路径要分开读图。闭合磁路便于分析主要磁通；真实结构仍会有少量磁通分布在铁芯外，称为漏磁。\u003c/p>\u003cp>对于一只绕组，匝数 N 与电流 i 的乘积称为磁动势 ℱ，常用安匝表示。先把它理解成这个绕组的励磁能力。例如 100 匝、0.5 A，磁动势就是 50 安匝。\u003c/p>\u003cdiv class=\"equation\">ℱ = Ni\u003c/div>","q":{"id":"m1-s1","tag":"线圈与铁芯","prompt":"在闭合铁芯上绕线圈并通电，哪句话解释得最准确？","type":"choice","options":["铁芯本身提供励磁，线圈只负责引导磁通","线圈电流提供励磁，铁芯引导主要磁通","线圈中的电流会从导线进入铁芯，沿铁芯绕一圈"],"answer":1,"explain":"线圈电流建立磁场。高磁导率铁芯给主要磁通提供路径。图上沿铁芯的箭头表示磁通方向。","hints":["分别想一想电流流在哪里，图中的磁通线又画在哪里。"]}},{"title":"磁通、磁通密度和磁场强度","intuition":"先看铁芯横截面。磁通 Φ 描述穿过截面的总量，磁通密度 B 描述单位面积上的磁通。保持磁通不变时，截面越窄，单位面积分到的磁通越多。","conceptFlow":["找到与磁场垂直的截面","区分总量 Φ 与密度 B","用平方米代入面积"],"diagram":"motorCrossSection","referenceText":"教材 §1.1，印刷页 4–5，式 (1.3)–(1.7)。","body":"\u003cp>磁场与截面垂直、磁通密度近似均匀时，可用 Φ = BA。Φ 的单位是 Wb，B 的单位是 T，A 的单位是 m²。1 cm² = 10⁻⁴ m²。一般情况下，磁通是 B 在截面法向的分量对面积的积分。\u003c/p>\u003cp>H 表示磁场强度，单位 A/m。在线性材料近似下，B = μH，其中 μ 为磁导率，单位 H/m，μ = μ\u003csub>r\u003c/sub>μ\u003csub>0\u003c/sub>，μ\u003csub>r\u003c/sub> 无量纲。真实铁芯的 B–H 关系会随磁化状态变化，本讲把 μ\u003csub>r\u003c/sub> 当作给定常数。\u003c/p>\u003cdiv class=\"equation\">Φ = BA；B = μH\u003c/div>","q":{"id":"m1-s2","tag":"面积换算","prompt":"磁通 80 μWb 垂直且均匀穿过 4 cm² 的截面。磁通密度 B 是多少？","type":"number","value":0.2,"unit":"T","explain":"80 μWb = 80×10⁻⁶ Wb，4 cm² = 4×10⁻⁴ m²。用 Φ 除以面积，得到 0.20 T。","hints":["先将 μWb 换成 Wb，cm² 换成 m²。","用 B = Φ/A。"]}},{"title":"从磁动势到磁阻","intuition":"同样的磁动势下，磁路越长，建立相同磁通越费力。截面越宽或磁导率越高，磁路越容易通过磁通。把这三项合在一起，就得到磁阻。","conceptFlow":["从绕组求 ℱ","从材料和几何求 ℛ","根据磁路求 Φ"],"diagram":"motorCore","referenceText":"教材 §1.1，印刷页 4–7，式 (1.5)–(1.7)、(1.13)–(1.18)。","body":"\u003cp>对截面均匀、磁导率可视为常数的一段磁路，取平均路径长度 l，用磁阻 ℛ 表示它对磁通的影响。单路径、忽略漏磁时，磁通可用磁动势除以总磁阻求得。磁阻单位可写成 A·匝/Wb，和电路电阻的 Ω 不同。\u003c/p>\u003cdiv class=\"equation\">ℛ = \u003cspan class=\"fraction\">\u003cspan>l\u003c/span>\u003cspan>μA\u003c/span>\u003c/span>；Φ = \u003cspan class=\"fraction\">\u003cspan>ℱ\u003c/span>\u003cspan>ℛ\u003c/span>\u003c/span>\u003c/div>\u003cp>可以借用串联电阻的计算习惯。绕组磁动势对应电压，磁通对应电流，磁阻对应电阻。这个类比用于列式；铁芯损耗需要用其他模型分析。\u003c/p>","q":{"id":"m1-s3","tag":"磁阻随结构变化","prompt":"在给定线性模型中，励磁与材料保持不变，单路径铁芯的平均路径长度不变、整个截面积减半，磁通如何变化？","type":"choice","options":["磁通减半","磁通不变","磁通加倍"],"answer":0,"explain":"ℛ = l/(μA)。A 减半使磁阻加倍，固定 ℱ 下磁通减半。","hints":["先看面积在磁阻式的分子还是分母。"]}},{"title":"气隙很短，为什么影响很大","intuition":"磁场可以穿过空气。空气的磁导率比铁芯小得多，所以一个很短的气隙，也可能耗去大部分磁动势。对电机来说，气隙给转子留出了旋转空间。","conceptFlow":["分开估算铁芯与气隙","单路径串联磁阻相加","用总磁阻求磁通"],"diagram":"motorGap","referenceText":"教材 §1.1，印刷页 5–8，图 1.2–1.4，式 (1.13)–(1.17)。","body":"\u003cp>将磁路分成铁芯 c 与气隙 g 两段。短气隙、忽略漏磁与边缘扩散时，两段通过同一磁通，磁阻串联相加。空气取 μ\u003csub>0\u003c/sub> ≈ 4π×10⁻⁷ H/m。只有在气隙很短且忽略边缘扩散时，才把气隙有效面积近似为铁芯截面积。\u003c/p>\u003cdiv class=\"equation\">ℛ\u003csub>c\u003c/sub> = \u003cspan class=\"fraction\">\u003cspan>l\u003csub>c\u003c/sub>\u003c/span>\u003cspan>μ\u003csub>r\u003c/sub>μ\u003csub>0\u003c/sub>A\u003csub>c\u003c/sub>\u003c/span>\u003c/span>；ℛ\u003csub>g\u003c/sub> = \u003cspan class=\"fraction\">\u003cspan>g\u003c/span>\u003cspan>μ\u003csub>0\u003c/sub>A\u003csub>g\u003c/sub>\u003c/span>\u003c/span>\u003c/div>\u003cp>同面积时，ℛ\u003csub>g\u003c/sub>/ℛ\u003csub>c\u003c/sub> = μ\u003csub>r\u003c/sub>g/l\u003csub>c\u003c/sub>。比较时要把 g 和 l\u003csub>c\u003c/sub> 换成同一种长度单位。真实电机还可能有多个气隙、漏磁、磁场扩散和饱和，不能仅凭本讲估算判断设备能否运行。\u003c/p>","q":{"id":"m1-s4","tag":"判断气隙是否主导","prompt":"铁芯平均长度 200 mm，相对磁导率 1000。气隙 0.2 mm，和铁芯截面积相同，忽略边缘扩散。两段磁阻谁大？","type":"choice","options":["铁芯磁阻大约是气隙的 1000 倍","气隙磁阻大约是铁芯的 1000 倍","两段磁阻相等"],"answer":2,"explain":"同面积时，ℛg/ℛc = μr·g/lc = 1000×0.2/200 = 1。空气磁导率虽低，路径也短，两个因素要一起考虑。","hints":["分别写出铁芯和气隙的磁阻式，相除约掉共同的截面积和 μ₀。"]}}],"finale":{"diagram":"motorGap","intro":"用一个简化的带气隙铁芯理解设备中的励磁。线圈 200 匝，电流 0.50 A。铁芯平均路径长度 0.25 m，相对磁导率 1000。单个气隙长 0.50 mm，两段截面积均取 4.0 cm²。把铁芯视为线性材料，忽略漏磁及气隙边缘扩散，取 μ₀ ≈ 4π×10⁻⁷ H/m。示意图不按比例绘制。","parts":[{"id":"m1-f1","tag":"磁动势","prompt":"绕组的磁动势是多少？","type":"number","value":100,"unit":"At","explain":"ℱ = Ni = 200×0.50 = 100 安匝。","hints":["先找匝数和实际流过绕组的电流。"]},{"id":"m1-f2","tag":"比较磁阻","prompt":"气隙磁阻是铁芯磁阻的多少倍？","type":"number","value":2,"unit":"1","explain":"同面积时，ℛg/ℛc = 1000×0.00050/0.25 = 2。","hints":["先统一长度单位。","相除后 μ₀ 和截面积抵消。"]},{"id":"m1-f3","tag":"求磁通","prompt":"通过铁芯的磁通是多少？可用 μWb 作答。","type":"number","value":67.02064327658226,"unit":"μWb","explain":"铁芯磁阻约 4.97×10⁵ 安匝/Wb，气隙磁阻约 9.95×10⁵ 安匝/Wb。用 100 安匝除以总磁阻，得到约 67.0 μWb。","hints":["把 4.0 cm² 换成 4.0×10⁻⁴ m²。","单路径的总磁阻等于两段相加。"]},{"id":"m1-f4","tag":"求磁通密度","prompt":"铁芯中的磁通密度是多少？","type":"number","value":0.16755160819145565,"unit":"T","explain":"B = Φ/A ≈ 67.0×10⁻⁶ ÷ (4.0×10⁻⁴) ≈ 0.168 T。","hints":["将磁通换算为 Wb，面积用 m²。"]},{"id":"m1-f5","tag":"预测气隙变化","prompt":"如果只增大气隙长度，且线性近似及忽略边缘扩散仍适用，固定电流下磁通怎么变？","type":"choice","options":["磁通减小","磁通不变","磁通增大"],"answer":0,"explain":"气隙变长使总磁阻增大。固定磁动势时，磁通随之减小。","hints":["先判断气隙磁阻变化，再看 Φ = ℱ/ℛ总。"]}],"solution":["先统一单位：0.50 mm = 5.0×10⁻⁴ m，4.0 cm² = 4.0×10⁻⁴ m²。","磁动势是 200×0.50 = 100 安匝。代入各段长度、磁导率与面积，得到铁芯磁阻约 4.97×10⁵ 安匝/Wb，气隙磁阻约 9.95×10⁵ 安匝/Wb。","两段磁阻相加，磁通约 67.0 μWb；除以铁芯面积得到 B ≈ 0.168 T。","核对结果：气隙磁阻约是铁芯的两倍，占总磁阻约三分之二。其他条件相同时，气隙更长会使总磁阻更大、磁通更小。"],"takeaways":["励磁来自绕组电流。单绕组磁动势 ℱ = Ni，N 为匝数、i 用 A、ℱ 用安匝。","Φ 是磁通（Wb），B 是磁通密度（T），H 是磁场强度（A/m）。均匀且垂直截面时 Φ = BA；线性近似下 B = μH。","ℛ = l/(μA) 用于均匀线性磁路的一段；单路径、忽略漏磁时，两段磁阻相加并用 Φ = ℱ/ℛ总。","用短气隙模型估算时，要说明是否忽略了边缘扩散；真实材料还可能饱和。"],"connection":"接下来教材 §1.2 用磁通解释磁链、电感和储能。理解磁通如何穿过绕组之后，就能进一步理解变压器的感应电压，以及电机气隙怎样影响励磁。","practice":"画一张铁芯加线圈的草图，标出绕组电流、磁通方向和气隙。用纸笔或表格比较 g = 0、0.50 mm、1.00 mm 时的磁通，记录三组结果和变化原因。只需理想模型计算。"}},{"subject":"machines","group":"第1章 · 磁路与磁材料","minutes":"45–60","prior":"开始学习","id":"m2","number":"2","title":"磁链、电感与磁场储能","prereq":"理解线圈提供励磁、磁阻和磁通的关系，能读懂简单的电压、电流和功率关系。","use":"继电器线圈的电流建立过程、变压器绕组感应电压和电机励磁，都涉及磁链的建立或变化。","source":"Stephen D. Umans，《Fitzgerald & Kingsley’s Electric Machinery》第 7 版，第 1 章 §1.2，印刷页 11–19。讲解、图示和练习为本课程自主编写。","goals":["区分磁通 Φ 与绕组磁链 λ","理解磁链变化如何产生感应电压","在线性固定结构中估算电感与储能"],"guides":["同一磁通穿过更多匝，绕组看到的效果如何变化？","磁通不变但很大时，会产生感应电压吗？","固定电流下，气隙增大为什么可能使电感下降？"],"sections":[{"title":"磁通穿过每一匝，合起来就是磁链","intuition":"磁通描述磁场穿过某个截面。绕组有许多匝，磁链把每一匝链到的磁通加起来。","conceptFlow":["找出绕组匝数","判断各匝是否链到相同磁通","相同则乘匝数"],"body":"\u003cp>如果同一磁通 Φ 完整链过 N 匝，磁链为 λ = NΦ，常用 Wb·匝表示。比如每匝链到 40 μWb，共 100 匝，磁链就是 4.0 mWb·匝。如果各匝链到的磁通不同，应逐匝按一致方向相加。\u003c/p>\u003cdiv class=\"equation\">λ = NΦ（各匝链过同一磁通）\u003c/div>","q":{"id":"m2-s1","tag":"磁链","prompt":"120 匝都链过 50 μWb，绕组磁链是多少？","type":"number","value":6,"unit":"mWb·turn","explain":"120×50 μWb·匝 = 6000 μWb·匝 = 6.0 mWb·匝。","hints":["先乘匝数，再做前缀换算。"]},"referenceText":"教材 §1.2，印刷页 11，式 (1.25)。","diagram":"motorCore"},{"title":"磁链变化才会出现感应电压","intuition":"看磁链变化的快慢。相同变化量若在更短时间完成，平均感应电压的幅值就更大。","conceptFlow":["比较起止磁链","用变化量除以时间","按参考方向判断正负"],"body":"\u003cp>沿教材定义的绕组端电压参考方向，理想绕组的感应电压写成 e = dλ/dt。若描述沿闭合回路的感应电动势，并按指定绕向取正，则常写成 −dλ/dt，负号反映楞次定律。计算幅值时可先用 |Δλ/Δt|。\u003c/p>\u003cdiv class=\"equation\">|e\u003csub>平均\u003c/sub>| = \u003cspan class=\"fraction\">\u003cspan>|Δλ|\u003c/span>\u003cspan>Δt\u003c/span>\u003c/span>\u003c/div>\u003cp>线圈带有电阻时，端电压还包含电阻压降。本节小题只问由磁链变化产生的部分。\u003c/p>","q":{"id":"m2-s2","tag":"感应条件","prompt":"线圈静止，磁链稳定保持在 8 mWb·匝。磁链变化引起的感应电压是多少？","type":"choice","options":["0 V","8 V","取决于磁链绝对值，无法判断"],"answer":0,"explain":"磁链恒定，变化率是零。","hints":["看磁链是保持不变还是正在变化。"]},"referenceText":"教材 §1.2，印刷页 11，式 (1.26)。"},{"title":"电感衡量电流变化带来的磁链变化","intuition":"对几何固定且磁性材料近似线性的绕组，磁链与电流成正比。比例系数就是电感。","conceptFlow":["先确认几何固定","判断线性近似是否适用","用磁链和电流求电感"],"body":"\u003cp>在单绕组线性磁路中，λ = Li，L 的单位为 H。忽略漏磁、各匝链过同一磁通时，把 Φ = Ni/ℛ总代入 λ = NΦ，就得到 L = N²/ℛ总。匝数平方的两个 N 分别来自励磁和磁链。\u003c/p>\u003cdiv class=\"equation\">L = \u003cspan class=\"fraction\">\u003cspan>λ\u003c/span>\u003cspan>i\u003c/span>\u003c/span> = \u003cspan class=\"fraction\">\u003cspan>N²\u003c/span>\u003cspan>ℛ\u003csub>总\u003c/sub>\u003c/span>\u003c/span>\u003c/div>\u003cp>磁路饱和时，λ 与 i 的关系会变弯。此时不能用一个固定 L 描述所有工作点的变化。\u003c/p>","q":{"id":"m2-s3","tag":"求电感","prompt":"线性绕组中，0.25 A 对应 10 mWb·匝，电感是多少？","type":"number","value":40,"unit":"mH","explain":"10×10⁻³ ÷ 0.25 = 0.040 H = 40 mH。","hints":["先把磁链换算为 Wb·匝。"]},"referenceText":"教材 §1.2，印刷页 11–12，式 (1.27)–(1.29)。","diagram":"motorGap"},{"title":"线圈把能量暂时存进磁场","intuition":"电流逐渐建立时，电源向线圈的磁场送入能量。断开驱动后，储能仍会通过回路释放，这也是要考虑续流路径的原因。","conceptFlow":["由电流建立磁场","按线性模型估算储能","结合实际回路理解释放"],"body":"\u003cp>以零电流为起点，电感恒定时，磁场储能 W = ½Li²。这里 L 用 H、i 用 A，结果用 J。电流加倍，储能变为四倍。实际线圈的电阻发热需要另计。\u003c/p>\u003cdiv class=\"equation\">W = ½Li²\u003c/div>\u003cp>例如 40 mH 的线圈在 0.50 A 时，储能是 5 mJ。用纸笔分析断电后能量如何释放，实物保护电路要结合设备与器件额定条件设计。\u003c/p>","q":{"id":"m2-s4","tag":"计算储能","prompt":"固定电感为 80 mH，电流为 0.50 A，磁场储能是多少？","type":"number","value":10,"unit":"mJ","explain":"½×0.080×0.50² = 0.010 J = 10 mJ。","hints":["mH 先换成 H。","检查电流是否平方。"]},"referenceText":"教材 §1.2，印刷页 17–18，式 (1.40)–(1.45)。"}],"finale":{"diagram":"motorGap","intro":"一只简化电磁线圈有 100 匝。电流由 0 均匀升到 0.50 A，用时 20 ms，终点每匝链过 200 μWb。假设几何固定、磁路线性，所有匝链过同一磁通。忽略电阻压降，只求磁链变化对应的电压。","parts":[{"id":"m2-f1","tag":"终点磁链","prompt":"终点磁链是多少？","type":"number","value":20,"unit":"mWb·turn","explain":"100×200 μWb·匝 = 20 mWb·匝。","hints":["把单匝磁通乘以 100。"]},{"id":"m2-f2","tag":"等效电感","prompt":"绕组电感是多少？","type":"number","value":40,"unit":"mH","explain":"20 mWb·匝 ÷ 0.50 A = 40 mH。","hints":["用 L = λ/i。"]},{"id":"m2-f3","tag":"平均感应电压","prompt":"这 20 ms 内感应电压的平均幅值是多少？","type":"number","value":1,"unit":"V","explain":"(0.020−0) Wb·匝 ÷ 0.020 s = 1.0 V。","hints":["磁链变化量和时间都换成 SI 单位。"]},{"id":"m2-f4","tag":"磁场储能","prompt":"终点的磁场储能是多少？","type":"number","value":5,"unit":"mJ","explain":"½×0.040×0.50² = 0.005 J。","hints":["用终点电流。"]}],"solution":["每匝磁通 200 μWb，100 匝共 20 mWb·匝。","磁链除以终点电流得到 40 mH。","在 20 ms 内磁链增加 0.020 Wb·匝，平均感应电压幅值为 1.0 V。","储能为 ½×0.040×0.50² = 5 mJ。可用线性上升的平均电流 0.25 A 检查：1.0 V×0.25 A×0.020 s = 5 mJ。"],"takeaways":["λ = NΦ 适用于各匝链过同一磁通，λ 用 Wb·匝。","感应电压由磁链变化率决定，电压的正负要结合参考方向。","几何固定且近似线性时，L = λ/i，磁场储能 W = ½Li²。","单绕组集中磁路中，L = N²/ℛ总。气隙增大会改变总磁阻。"],"connection":"下一讲看真实铁芯材料为何会饱和、为何会有磁滞，再衔接交流励磁、铁损和变压器。","practice":"把综合题的上升时间从 20 ms 改成 10 ms，其他条件不变。画两条磁链曲线，比较感应电压和最终储能分别变不变。"}},{"subject":"machines","group":"第1章 · 磁路与磁材料","minutes":"45–60","prior":"开始学习","id":"m3","number":"3","title":"磁材料、饱和与磁滞","prereq":"知道 B、H、磁导率及磁动势的含义，能读坐标图并用 Φ = BA 求磁通。","use":"读懂变压器、电机和接触器铁芯为什么会出现励磁电流增大与发热，以及设备选材时看哪些指标。","source":"Stephen D. Umans，《Fitzgerald & Kingsley’s Electric Machinery》第 7 版，第 1 章 §1.3，印刷页 19–22。损耗只作 §1.4（印刷页 25–27）的预习。示意曲线与练习数据为自主编写。","goals":["读懂 B–H 曲线和磁饱和","在磁滞回线上分辨剩磁与矫顽力","对照给定 B–H 数据估算励磁，了解铁损来源"],"guides":["把磁场强度 H 继续增加，磁通密度 B 会一直按同样比例增加吗？","励磁撤去后，铁芯里的磁通密度一定回到零吗？","铁芯没有接电线，为什么交变磁场下它仍会发热？"],"sections":[{"title":"看懂 B–H 曲线与饱和","intuition":"H 描述励磁有多强，B 描述材料中建立了多少磁通密度。随着铁芯趋于饱和，同样增加一点 H，能增加的 B 会变少。","conceptFlow":["横轴先找 H","纵轴读 B","看斜率如何变小"],"body":"\u003cp>第一讲把 μ 当常数，用 B = μH 估算。真实铁磁材料的 B–H 曲线并非处处成比例。在固定铁芯和绕组的近似下，为了把 B 从接近饱和处再推高一点，往往需要明显增加励磁电流。\u003c/p>\u003cp>工程上用实际材料的磁化曲线读工作点，并核对曲线的材料、测试条件与坐标刻度。图中曲线只演示形状。\u003c/p>","q":{"id":"m3-s1","tag":"饱和","prompt":"铁芯已经接近饱和，再希望略微增大 B，通常需要怎样改变励磁？","type":"choice","options":["略微降低 H","明显提高 H","保持 H 不变"],"answer":1,"explain":"饱和附近 B–H 曲线变平，增加同样的 B 需要更大的 H 增量。","hints":["看曲线靠右部分的斜率。"]},"referenceText":"教材 §1.3，印刷页 19–21，图 1.9–1.10。","diagram":"motorBH"},{"title":"磁滞、剩磁与矫顽力","intuition":"把材料先磁化到正向，再把励磁减小。B 的变化路线不会原样返回，材料的磁化状态与前面怎样励磁有关。","conceptFlow":["沿着回线走","H = 0 时读剩磁","B = 0 时读反向 H"],"body":"\u003cp>从正向磁化的回线分支撤去励磁，H = 0 时残留的 B 叫剩磁 B\u003csub>r\u003c/sub>。继续反向励磁，到 B = 0 时所需反向 H 的幅值是矫顽力 H\u003csub>c\u003c/sub>。不同回线和测量条件会影响读到的数值。\u003c/p>\u003cp>软磁材料一般容易反复磁化，适合许多交流铁芯。永磁材料需要在工作条件下维持磁化状态，选材还要看材料的退磁特性。\u003c/p>","q":{"id":"m3-s2","tag":"读磁滞回线","prompt":"从正向磁化分支把 H 降到零，读出的 B 叫什么？","type":"choice","options":["矫顽力","磁阻","剩磁"],"answer":2,"explain":"剩磁是 H = 0 时留下的 B。矫顽力是使 B 回到零所需的反向 H 幅值。","hints":["先判断是在横轴还是纵轴找截距。"]},"referenceText":"教材 §1.3，印刷页 19–21，图 1.9。","diagram":"motorHysteresis"},{"title":"用材料数据代替固定磁导率","intuition":"给定目标 B 后，从材料曲线上读出需要的 H，再乘铁芯路径长度求铁芯段的磁动势。气隙仍按空气近似处理。","conceptFlow":["用 B 找材料曲线上的 H","各段分别计算 Hl","相加后除以匝数"],"body":"\u003cp>在短气隙、忽略漏磁和边缘扩散的磁路中，若两段等截面，则 B 近似相同。已知目标 B 时，铁芯的 H\u003csub>c\u003c/sub> 由材料曲线读取，气隙的 H\u003csub>g\u003c/sub> = B/μ\u003csub>0\u003c/sub>。用 ℱ = H\u003csub>c\u003c/sub>l\u003csub>c\u003c/sub> + H\u003csub>g\u003c/sub>g，再由 i = ℱ/N 求电流。\u003c/p>\u003cp>这里下标 c 表示铁芯。上一节 H\u003csub>c\u003c/sub> 表示矫顽力，两处符号的含义要看上下文。\u003c/p>","q":{"id":"m3-s3","tag":"读曲线后求励磁","prompt":"示例材料在目标 B 下需要 200 A/m。铁芯平均路径长 0.30 m，这一段磁动势是多少？","type":"number","value":60,"unit":"At","explain":"200 A/m×0.30 m = 60 安匝。","hints":["把从曲线读出的 H 乘路径长度。"]},"referenceText":"教材 §1.3，印刷页 21–22，图 1.10 与例 1.7。","diagram":"motorGap"},{"title":"预习铁损，区分磁滞与涡流","intuition":"交变磁场下，铁芯会反复磁化。磁滞造成每周期的能量损耗；交变磁通还会在导电铁芯内部感应出涡流并发热。","conceptFlow":["先辨认交变磁通","区分磁滞与涡流","看材料和结构怎样减小损耗"],"body":"\u003cp>在给定的磁滞回线下，每周期单位体积的磁滞损耗由回线面积表征。薄且相互绝缘的叠片可限制涡流回路，从而减小涡流损耗。线圈绕组因电阻产生的损耗通常单独计为铜损。\u003c/p>\u003cp>实际损耗随材料、频率、波形和磁通密度等条件变化。本讲只建立区别，计算会在交流励磁部分继续。\u003c/p>","q":{"id":"m3-s4","tag":"判断减损方式","prompt":"工频铁芯采用相互绝缘的薄片，主要用于减小哪项损耗？","type":"choice","options":["绕组铜损","铁芯涡流损耗","端子接触损耗"],"answer":1,"explain":"绝缘层限制导电铁芯内涡流的回路。","hints":["想想电流能否跨过相邻绝缘片。"]},"referenceText":"教材 §1.4，印刷页 25–27，铁损部分预习。"}],"finale":{"diagram":"motorGap","intro":"简化电磁铁的平均铁芯路径长 0.30 m，气隙长 0.20 mm，截面积均为 4.0 cm²，绕组 200 匝。目标 B 为 1.0 T。给定教学用材料曲线上，B = 1.0 T 对应铁芯 H = 200 A/m。忽略漏磁和边缘扩散，取 μ₀ ≈ 4π×10⁻⁷ H/m。","parts":[{"id":"m3-f1","tag":"目标磁通","prompt":"达到目标 B 时，截面磁通是多少？","type":"number","value":0.4,"unit":"mWb","explain":"1.0×4.0×10⁻⁴ Wb = 0.40 mWb。","hints":["把截面积换成 m²。"]},{"id":"m3-f2","tag":"铁芯磁动势","prompt":"铁芯段的磁动势是多少？","type":"number","value":60,"unit":"At","explain":"200×0.30 = 60 安匝。","hints":["材料曲线已给铁芯段 H。"]},{"id":"m3-f3","tag":"气隙磁动势","prompt":"气隙段的磁动势是多少？","type":"number","value":159.15494309189535,"unit":"At","explain":"(1.0/μ₀)×0.00020 ≈ 159 安匝。","hints":["气隙按空气的 B/μ₀ 求 H。"]},{"id":"m3-f4","tag":"所需励磁电流","prompt":"绕组需要多大的励磁电流？","type":"number","value":1.0957747154594768,"unit":"A","explain":"(60+159)/200 ≈ 1.10 A。","hints":["先将两段磁动势相加。"]}],"solution":["磁通 Φ = BA = 0.40 mWb。","由示例曲线读得铁芯 H = 200 A/m，乘 0.30 m 得 60 安匝。","同一截面积且忽略边缘扩散时，气隙 B 近似等于铁芯 B。用 B/μ₀ 求 H，再乘气隙长度得约 159 安匝。","总磁动势约 219 安匝，除以 200 匝得约 1.10 A。气隙虽然短，所需磁动势仍大于铁芯段。"],"takeaways":["B–H 曲线描述磁性材料响应。接近饱和时，要增加同样的 B 往往需要更多 H。","H = 0 时看剩磁 Bᵣ，B = 0 时看矫顽力的幅值。","非线性铁芯可在给定 B 时从材料曲线读 H，并用每段 Hl 估算磁动势。模型仍要交代路径和漏磁假设。","交流铁损包含磁滞和涡流等损耗。叠片主要抑制涡流，绕组铜损单独分析。"],"connection":"后续交流励磁会把磁链变化、感应电压、励磁电流与铁损连起来，再进入变压器。","practice":"画出一条 B–H 曲线和一条磁滞回线，分别标出饱和区、剩磁、矫顽力。记录这三个标记如何从图中读出。"}}]}; const APP_STYLES="\r\n:root{--bg:#f3f6fa;--paper:#fff;--ink:#162e48;--text:#2b4057;--muted:#607286;--line:#d9e3ee;--blue:#1463db;--blue-light:#eaf2ff;--gold:#986310;--gold-light:#fff6df;--ok:#08785a;--ok-light:#eaf7f1;--bad:#b33c3c;--bad-light:#fff0ef;--radius:12px;font-family:\"Microsoft YaHei\",\"PingFang SC\",system-ui,sans-serif;color:var(--text);background:var(--bg);font-size:16px}\r\n*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button,a,input,textarea,select{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #7aaaf2}\r\nbutton{cursor:pointer}button:disabled{opacity:.45;cursor:default}a{color:var(--blue)}.skip{position:fixed;top:-70px;left:20px;z-index:100;background:#fff;padding:12px}.skip:focus{top:8px}\r\n.topbar{height:76px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:20px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:13px;font-weight:700;font-size:21px;color:var(--ink);white-space:nowrap}.brand svg{width:33px;height:33px;color:var(--blue)}.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:3px}.tools{display:flex;align-items:center;gap:8px}.tool{border:0;background:transparent;color:var(--text);padding:10px 12px;border-radius:7px;font-size:14px}.tool:hover{background:var(--bg)}.primary{border:1px solid var(--blue);background:var(--blue);color: function plotSVG(lines,{xlabel='时间',ylabel='归一化值',xmax=5,ymin=0,ymax=1,ticks=[0,1,2,3,4,5]}={}){
 const w=660,h=230,left=55,right=23,top=20,bottom=43,pw=w-left-right,ph=h-top-bottom;
 const px=x=>left+x/xmax*pw,py=y=>top+(ymax-y)/(ymax-ymin)*ph;
 const grid=ticks.map(t=>'<path d="M'+px(t)+' '+top+' V'+(h-bottom)+'" stroke="#e2eaf3"/><text x="'+px(t)+'" y="'+(h-bottom+22)+'" text-anchor="middle">'+t+'</text>').join('');
 const paths=lines.map(l=>'<path d="'+l.points.map(([x,y],i)=>(i?'L':'M')+px(x).toFixed(2)+' '+py(y).toFixed(2)).join(' ')+'" fill="none" stroke="'+l.color+'" stroke-width="2.7"/>').join('');
 return '<svg class="plot" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(ylabel+'随'+xlabel+'变化的数学模型曲线')+'">'+grid+'<path d="M'+left+' '+top+' V'+(h-bottom)+' H'+(w-right)+'" stroke="#9eb1c9" fill="none"/>'+paths+'<text x="'+left+'" y="12">'+esc(ylabel)+'</text><text x="'+(w-right)+'" y="'+(h-3)+'" text-anchor="end">'+esc(xlabel)+'</text></svg>';
}
function updateWidget(node){
 const vals={};node.querySelectorAll('[data-param]').forEach(el=>{vals[el.dataset.param]=Number(el.value);node.querySelector('[data-output="'+el.dataset.param+'"]').textContent=el.value;});
 const kind=node.dataset.widget,read=node.querySelector('[data-readout]'),plot=node.querySelector('[data-plot]');
 if(kind==='rc'){
  const tau=vals.r*1000*vals.c*1e-6,u1=vals.u*(1-Math.exp(-1)),i0=vals.u/vals.r;
  read.innerHTML='<span>τ = <strong>'+tau.toFixed(3)+' s</strong></span><span>uC(τ) = <strong>'+u1.toFixed(2)+' V</strong></span><span>初始电流 = <strong>'+i0.toFixed(2)+' mA</strong></span>';
  plot.innerHTML=plotSVG([{color:'#1463db',points:Array.from({length:101},(_,i)=>[i/20,vals.u*(1-Math.exp(-i/20))])}],{xlabel:'时间 t / τ（横轴实际5τ = '+(5*tau).toFixed(3)+' s）',ylabel:'uC / V',ymax:vals.u});
 }else if(kind==='load'){
  const i=10/(2+vals.rl),u=i*vals.rl,p=i*i*vals.rl;
  read.innerHTML='<span>iL = <strong>'+i.toFixed(3)+' A</strong></span><span>UL = <strong>'+u.toFixed(3)+' V</strong></span><span>PL = <strong>'+p.toFixed(3)+' W</strong></span>';
  plot.innerHTML=plotSVG([{color:'#1463db',points:Array.from({length:101},(_,i)=>{const r=i/5;return [r,10*r/(2+r)];})}],{xlabel:'负载 RL / Ω',ylabel:'端口 UL / V',xmax:20,ymax:10,ticks:[0,4,8,12,16,20]});
 }else{
  const phi=vals.phase*Math.PI/180;
  read.innerHTML='<span>φu − φi = <strong>'+vals.phase+'°</strong></span><span><strong>'+(vals.phase>0?'电流滞后':vals.phase<0?'电流超前':'电压电流同相')+'</strong></span><span>蓝线：u；金线：i（均归一化）</span>';
  plot.innerHTML=plotSVG([{color:'#1463db',points:Array.from({length:161},(_,i)=>[i/80,Math.cos(i/80*2*Math.PI)])},{color:'#b97720',points:Array.from({length:161},(_,i)=>[i/80,Math.cos(i/80*2*Math.PI-phi)])}],{xlabel:'时间 t / T',ylabel:'归一化幅值',xmax:2,ymin:-1.2,ymax:1.2,ticks:[0,.5,1,1.5,2]});
 }
}
